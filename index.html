<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Task Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#16222a;--muted:#66757f;--paper:#f6f7f8;--surface:#fff;--line:#e4e8eb;--line2:#cfd7dc;--brand:#0e6b6b;--brand-d:#0a5252;--brand-s:#e3f1f0;--bad:#c2362b;--bad-s:#fcebe9;--warn:#8a5200;--warn-s:#fdf0dc;--ok:#1a7f4b;--ok-s:#e3f4ea;--info:#2a5db0;--info-s:#e8eefa;--hover:#f1f4f5;--soft:#eef1f3;--track:#e4e9ec;--on-brand:#fff;--pad:13px;--tap:44px;--r:12px;--shadow:0 10px 34px rgba(20,33,43,.2);color-scheme:light;font-family:Figtree,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e8eef1;--muted:#8d9ba5;--paper:#0f1519;--surface:#171f25;--line:#26323a;--line2:#34434d;--brand:#4fc3bd;--brand-d:#7fe0da;--brand-s:#16312f;--bad:#ff8a7e;--bad-s:#3a1d1a;--warn:#f0b35c;--warn-s:#3a2c14;--ok:#5fd394;--ok-s:#17301f;--info:#8db4f5;--info-s:#1b2a44;--hover:#1e2830;--soft:#202b33;--track:#2a3740;--on-brand:#062423;--shadow:0 10px 34px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme=dark]{--ink:#e8eef1;--muted:#8d9ba5;--paper:#0f1519;--surface:#171f25;--line:#26323a;--line2:#34434d;--brand:#4fc3bd;--brand-d:#7fe0da;--brand-s:#16312f;--bad:#ff8a7e;--bad-s:#3a1d1a;--warn:#f0b35c;--warn-s:#3a2c14;--ok:#5fd394;--ok-s:#17301f;--info:#8db4f5;--info-s:#1b2a44;--hover:#1e2830;--soft:#202b33;--track:#2a3740;--on-brand:#062423;--shadow:0 10px 34px rgba(0,0,0,.55);color-scheme:dark}
:root[data-density=compact]{--pad:8px;--tap:38px}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;width:100%;max-width:100vw;overflow-x:hidden;-webkit-text-size-adjust:100%}#root{width:100%;max-width:100vw;min-width:0;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}h2{font-size:1.15rem}h3{font-size:.95rem}
p{margin:.4em 0}small,.muted{color:var(--muted)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* top progress bar: runs while the app waits for the server */
#bar{position:fixed;z-index:60;top:0;left:0;right:0;height:3px;opacity:0;transition:opacity .2s;pointer-events:none;background:linear-gradient(90deg,transparent,var(--brand),transparent) -40% 0/35% 100% no-repeat}
#bar.on{opacity:1;animation:bar 1s linear infinite}
@keyframes bar{to{background-position:140% 0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 15px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);cursor:pointer;font-weight:600;transition:background-color .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:hover{background:#f4f7f8;border-color:#aab6bf}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.danger{color:var(--bad);border-color:#e6b4ae}.btn.danger:hover{background:var(--bad-s)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:#e7ecee}
.btn.sm{min-height:32px;padding:0 11px;font-size:.88rem}
.btn[disabled]{opacity:.6;cursor:default}.btn.busy{pointer-events:none}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:1.05rem;color:var(--brand);white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 13px;border-radius:var(--r);cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;transition:background-color .15s,color .15s}
.tab:hover{background:#eef2f3;color:var(--ink)}.tab[aria-current=page]{background:var(--brand-s);color:var(--brand-d)}
.grow{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
.page{max-width:1000px;margin:0 auto;padding:20px}

/* summary chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip-btn{display:flex;align-items:baseline;gap:7px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:600;transition:background-color .15s,border-color .15s}
.chip-btn b{font-size:1.05rem}.chip-btn:hover{border-color:var(--line2)}
.chip-btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip-btn.over b{color:var(--bad)}.chip-btn.over[aria-pressed=true] b{color:#ffb4ab}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters input,.filters select{height:38px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);min-width:0}
.filters .search{flex:1 1 220px}.filters .more{display:contents}
.field{display:block;margin:0 0 14px}.field>span{display:block;font-weight:600;margin-bottom:5px;font-size:.9rem}
.field input,.field select,.field textarea,.cell-in{width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r);background:#fff}
.field textarea{min-height:92px;resize:vertical}.field .hint{display:block;color:var(--muted);font-size:.84rem;margin-top:4px}
.field input:focus,.field select:focus,.field textarea:focus,.filters input:focus,.filters select:focus,.cell-in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* task list */
.group{margin:18px 0 8px;font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.group.over{color:var(--bad)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.group+.list{margin-top:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;border-bottom:1px solid var(--line);border-left:4px solid transparent;cursor:pointer;transition:background-color .15s}
.row:last-child{border-bottom:0}.row:hover{background:#f7f9fa}
.row.is-over{border-left-color:var(--bad)}.row.is-prog{border-left-color:var(--brand)}.row.is-done{border-left-color:transparent}
.row.is-done .title{color:var(--muted);text-decoration:line-through;text-decoration-color:#9aa8b2}
.row.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--brand-s)}to{background:transparent}}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);background:#fff;cursor:pointer;display:grid;place-items:center;color:transparent;transition:background-color .15s,border-color .15s,color .15s,transform .15s}
.tick:hover{border-color:var(--brand)}.tick:active{transform:scale(.9)}
.is-done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.tick svg{width:14px;height:14px}
.rmain{flex:1;min-width:0}.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:.86rem;margin-top:2px}
.side{display:flex;align-items:center;gap:12px;flex:none}
.prog{width:54px;height:5px;border-radius:3px;background:#e4e9ec;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.due{font-size:.86rem;color:var(--muted);min-width:96px;text-align:right}.is-over .due{color:var(--bad);font-weight:600}
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.st-Pending{background:#fde8e7;color:#b42318}.st-InProgress{background:var(--info-s);color:var(--info)}.st-Completed{background:var(--ok-s);color:var(--ok)}
.bulkbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin:10px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}.bulkbar select{min-height:38px;max-width:180px}.bulkbar .muted{font-size:.86rem}.select-task{width:18px;height:18px;flex:none;accent-color:var(--brand)}.assignee-list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:6px}.assignee-option{display:flex;align-items:center;gap:9px;padding:7px 5px;border-bottom:1px solid var(--line);font-size:.92rem}.assignee-option:last-child{border:0}.assignee-option input{width:18px;height:18px;accent-color:var(--brand)}
.manager-mail-list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:4px 10px}.manager-mail-option{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}.manager-mail-option:last-child{border:0}.manager-mail-option input{width:18px;height:18px;accent-color:var(--brand)}
.empty{padding:44px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line2);border-radius:10px}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.more-wrap{text-align:center;margin:16px 0}
.sk{background:linear-gradient(100deg,#e7ecef 30%,#f5f7f8 50%,#e7ecef 70%) 0 0/200% 100%;animation:sh 1.2s ease-in-out infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
.skrow{display:flex;gap:12px;align-items:center;padding:14px 14px;border-bottom:1px solid var(--line)}

/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,33,43,.4);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(580px,100%);display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .27s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dhead{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dhead h2{flex:1;overflow-wrap:anywhere}
.dbody{flex:1;overflow-y:auto;padding:18px}
.dfoot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbfb}
.sec{margin-bottom:20px}.sec>h3{margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line2);background:#fff;padding:8px 14px;cursor:pointer;font-weight:600;transition:background-color .15s,color .15s}
.seg button:last-child{border-right:0}.seg button:hover{background:#f1f5f6}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:.92rem}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #eef1f3}
.checks label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer}
.checks input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.checks .done span{color:var(--muted);text-decoration:line-through}
.checks .rm{border:0;background:transparent;color:var(--muted);cursor:pointer;opacity:0;font-size:1.1rem;transition:opacity .15s}
.checks li:hover .rm,.checks .rm:focus-visible{opacity:1}
.task-origin{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--brand-s);color:var(--brand-d);font-size:.75rem;font-weight:700}
.activity{list-style:none;margin:0;padding:0}.activity li{padding:9px 0;border-bottom:1px solid #eef1f3;font-size:.9rem}.activity small{display:block;margin-top:2px}
.pbar{height:6px;border-radius:3px;background:#e4e9ec;overflow:hidden;margin:4px 0 8px}.pbar i{display:block;height:100%;width:0;background:var(--brand);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.inline-add{display:flex;gap:8px;margin-top:10px}.inline-add input{flex:1;height:38px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r)}
.notice{padding:10px 12px;border-radius:var(--r);background:var(--info-s);color:#1b3f78;font-size:.9rem}
.notice.bad{background:var(--bad-s);color:var(--bad);white-space:pre-line}.notice.ok{background:var(--ok-s);color:var(--ok)}.notice.warn{background:var(--warn-s);color:var(--warn)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.quick button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:3px 11px;cursor:pointer;font-size:.84rem}.quick button:hover{background:var(--brand-s)}

/* person picker */
.picker{position:relative}.plist{position:absolute;z-index:5;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);max-height:240px;overflow:auto}
.plist li{padding:8px 10px;border-radius:6px;cursor:pointer}.plist li:hover,.plist li.hot{background:var(--brand-s)}.plist small{display:block}

/* toasts */
#toasts{position:fixed;z-index:70;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 28px);max-width:460px}
.toast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-radius:var(--r);background:var(--ink);color:#fff;box-shadow:var(--shadow);animation:tin .25s cubic-bezier(.2,.8,.2,1);pointer-events:auto;width:100%;box-sizing:border-box}
.toast.bad{background:var(--bad)}.toast.out{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
.toast-action{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:3px 10px;border-radius:6px;cursor:pointer;font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.5px;transition:all .15s;flex-shrink:0}
.toast-action:hover{background:rgba(255,255,255,.2);border-color:#fff}
.kbd-hint{display:inline-block;padding:2px 6px;border:1px solid var(--line2);border-radius:4px;background:var(--paper);font-size:.75rem;font-family:monospace;color:var(--muted);box-shadow:0 1px 0 var(--line2)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 14px 44px rgba(20,33,43,.1)}
.login-card h1{font-size:1.4rem;color:var(--brand);margin-bottom:4px}.login-card form{margin-top:20px}
.pw{position:relative}.pw button{position:absolute;right:4px;top:4px;height:32px;border:0;background:transparent;color:var(--brand);font-weight:600;cursor:pointer;padding:0 10px}

/* admin */
.subtabs{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.subtab{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.subtab[aria-current=page]{color:var(--brand-d);border-bottom-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.panel>h3{margin-bottom:10px;font-size:1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:#fafbfb}.tile b{display:block;font-size:1.5rem}.tile span{color:var(--muted);font-size:.86rem}.tile-button{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}.tile-button:hover,.tile-button[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 18%,transparent)}.draft-source{font-size:.76rem;color:var(--brand-d);font-weight:700}.dash-metric{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.dash-list{max-height:520px;overflow:auto}.dash-task{width:100%;text-align:left;color:inherit;font:inherit;border:0;background:transparent}.draft-warning{color:var(--warn);background:var(--warn-s);padding:8px;border-radius:8px}
.meter{height:12px;border-radius:6px;background:#e4e9ec;overflow:hidden;display:flex;margin:8px 0}.meter i{display:block;height:100%;transition:width .4s}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid #eef1f3;vertical-align:middle}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f7f9fa}
.scroll-x{overflow-x:auto}
.sw{position:relative;display:inline-block;width:40px;height:22px}.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:#c4cdd4;transition:background-color .18s}.sw span:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s}
.sw input:checked+span{background:var(--brand)}.sw input:checked+span:after{transform:translateX(18px)}.sw input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.badge{display:inline-block;min-width:48px;text-align:center;padding:2px 8px;border-radius:999px;font-size:.76rem;font-weight:700}
.b-PASS{background:var(--ok-s);color:var(--ok)}.b-WARN{background:var(--warn-s);color:var(--warn)}.b-FAIL{background:var(--bad-s);color:var(--bad)}
.tests li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eef1f3}.tests{list-style:none;margin:0;padding:0}.tests small{display:block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#c4cdd4}.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
.fab{display:none}
@supports (height:100dvh){.login{min-height:100dvh}.drawer{height:100dvh}}
button,input,select,textarea{-webkit-tap-highlight-color:transparent}

@media (max-width:720px){
  body{font-size:15px}
  
  
  .row{flex-wrap:wrap}.side{width:100%;justify-content:space-between;padding-left:36px}.due{text-align:left}
  .two{grid-template-columns:1fr}.kv{grid-template-columns:96px 1fr}
  .filters .search{flex-basis:100%}.filters select{flex:1 1 140px}
  .dhead{padding:14px 14px}.dbody{padding:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.dfoot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .subtabs{overflow-x:auto;flex-wrap:nowrap}.subtab{white-space:nowrap;padding:10px 12px}
  .btn,.chip-btn{touch-action:manipulation}.scroll-x{-webkit-overflow-scrolling:touch}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}#bar.on{animation:none;background:var(--brand)}}

/* ================= v2 skin: modern, minimal, adaptive ================= */
.btn{min-height:var(--tap);border-radius:var(--r);background:var(--surface)}.btn:hover{background:var(--hover);border-color:var(--line2)}
.btn.primary{color:var(--on-brand)}.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.ghost:hover{background:var(--hover)}.btn.sm{min-height:36px}.btn.danger{border-color:var(--line2)}
.avatar{color:var(--on-brand)}
.tab:hover{background:var(--hover)}.row:hover,.tbl tr.click:hover td{background:var(--hover)}
.tick{background:transparent}.is-done .tick{color:var(--on-brand)}
.prog,.pbar,.meter{background:var(--track)}
.field input,.field select,.field textarea,.cell-in,.filters input,.filters select,.inline-add input,.seg button,.quick button,.plist{background:var(--surface)}
.dfoot,.tile{background:var(--paper)}.checks li,.activity li,.tbl td,.tests li{border-color:var(--line)}
.notice{color:var(--info)}.sw span{background:var(--line2)}.sw span:after{background:#fff}
.sk{background:linear-gradient(100deg,var(--soft) 30%,var(--hover) 50%,var(--soft) 70%) 0 0/200% 100%}
.st-Pending{background:var(--soft);color:var(--muted)}
.chip-btn{border-color:transparent;background:transparent;color:var(--muted);padding:7px 14px}.chip-btn:hover{background:var(--hover);border-color:transparent}
.chip-btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seg{border:0;border-radius:999px;background:var(--soft);padding:3px;gap:2px}.seg button{border:0;border-radius:999px;background:transparent;color:var(--muted)}
.seg button:hover{background:transparent;color:var(--ink)}.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
.list{border-radius:16px}.row{padding-block:var(--pad)}
.toast{background:var(--ink);color:var(--paper)}.toast.bad{background:#b42318;color:#fff}
.drawer{border-radius:0}.panel{border-radius:16px}.login-card{border-radius:18px}
.hello h1{font-size:1.7rem;line-height:1.2;margin:0}.hello .sub{color:var(--muted);margin:4px 0 16px}
.qa{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px}
.qa:focus-within{border-color:var(--brand)}.qa input{flex:1;min-width:0;border:0;background:none;outline:0;min-height:var(--tap);font-size:1rem}
.qdue{display:flex;gap:6px;margin:10px 0 16px}.qpill{min-height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:.86rem;cursor:pointer}
.qpill[aria-pressed=true]{background:var(--brand-s);border-color:var(--brand);color:var(--brand-d)}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px}.chips::-webkit-scrollbar{display:none}.chip-btn{flex:none}
@media(hover:hover){.select-task{opacity:0;transition:opacity .15s}.row:hover .select-task,.select-task:checked,.select-task:focus-visible{opacity:1}}

/* adaptive shell: bottom bar on phones, side rail on desktop */
.rail{display:contents}.newbtn,.rail .profile{display:none}.top .brand{flex:1}
.top{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;justify-content:space-around;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;padding:6px 2px;font-size:.7rem;border-radius:12px}
.tab svg{width:22px;height:22px;flex:none}.tab[aria-current=page]{background:transparent;color:var(--brand)}
.page{padding:16px 14px calc(150px + env(safe-area-inset-bottom))}
.fab{display:grid;place-items:center;position:fixed;z-index:25;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);font-size:1.9rem;box-shadow:var(--shadow);cursor:pointer}
.fab[hidden]{display:none}
#toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
@media(max-width:859px){
  .drawer{top:auto;left:0;right:0;width:100%;height:auto;max-height:90vh;max-height:90dvh;border-radius:22px 22px 0 0;transform:translateY(104%)}.drawer.open{transform:none}
  .row{flex-wrap:wrap}.side{width:100%;justify-content:space-between;padding-left:36px}.due{text-align:left}
}
@media(min-width:860px){
  .rail{display:flex;flex-direction:column;position:fixed;z-index:30;left:0;top:0;bottom:0;width:232px;padding:20px 14px;gap:6px;background:var(--surface);border-right:1px solid var(--line)}
  .rail .top{position:static;padding:0 8px 12px;border:0;background:none}.top .avatar,.fab{display:none}
  .newbtn{display:inline-flex;margin-bottom:10px}
  .tabs{position:static;flex-direction:column;justify-content:flex-start;gap:2px;padding:0;border:0;background:none}
  .tab{flex:none;flex-direction:row;gap:12px;justify-content:flex-start;padding:0 12px;min-height:42px;font-size:.95rem}
  .tab[aria-current=page]{background:var(--brand-s);color:var(--brand-d)}
  .rail .profile{display:flex;align-items:center;gap:10px;padding:8px;border:0;border-radius:var(--r);background:none;text-align:left;cursor:pointer}.rail .profile:hover{background:var(--hover)}
  .rail .profile .avatar{display:grid;place-items:center;flex:none}.rail .profile small{display:block;color:var(--muted)}
  .rail~.page{margin:0 0 0 232px;max-width:none;padding:36px max(32px,calc((100% - 880px)/2)) 48px}
  #toasts{bottom:24px}
}
.tpl-group+.tpl-group{margin-top:10px}.tpl-head{padding:6px 5px 4px;font-size:.84rem}.tpl-head b{font-size:.9rem}
.assignee-option input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);flex:none}

/* ================= Enhanced New Task & Task Preview (V10 Clean & Optimized) ================= */
.task-mode-toggle{display:flex;gap:8px;margin-bottom:12px}
.mode-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:6px 14px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted);transition:all .15s}
.mode-btn:hover{border-color:var(--brand);color:var(--ink);background:var(--hover)}
.mode-btn[aria-pressed=true]{border-color:var(--brand);background:var(--brand-s);color:var(--brand-d);font-weight:700}
.target-info-box{padding:9px 12px;border-radius:var(--r);background:var(--brand-s);color:var(--brand-d);font-size:.84rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.clean-assignee-pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;background:var(--surface);border:1px solid var(--line2);border-radius:999px;font-size:.86rem}
.clean-assignee-pill .avatar-sm{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center}

.assignee-chips-bar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;max-height:100px;overflow-y:auto;padding:2px}
.assignee-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;background:var(--soft);border:1px solid var(--line2);border-radius:999px;font-size:.8rem;font-weight:600}
.assignee-chip .chip-rm{border:0;background:none;cursor:pointer;padding:0 2px;font-size:.9rem;color:var(--muted);line-height:1}
.assignee-chip .chip-rm:hover{color:var(--bad)}

/* Increased size & prominence for employee selection list */
.assignee-list-large{max-height:280px;overflow-y:auto;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);padding:4px}
.assignee-option-large{display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background-color .15s}
.assignee-option-large:last-child{border-bottom:0}
.assignee-option-large:hover{background:var(--hover)}
.assignee-option-large input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);flex:none}
.assignee-option-large .emp-avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center;flex:none}
.assignee-option-large .emp-name-main{font-weight:600;font-size:.9rem;color:var(--ink)}
.assignee-option-large .emp-meta-sub{font-size:.78rem;color:var(--muted)}

/* Increased size & prominence for ready-made templates selection */
.template-list-large{max-height:260px;overflow-y:auto;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);padding:4px}
.template-option-large{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background-color .15s}
.template-option-large:last-child{border-bottom:0}
.template-option-large:hover{background:var(--hover)}
.template-option-large input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);margin-top:2px;flex:none}

.task-titles-queue{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.task-title-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;background:var(--surface);border:1px solid var(--brand);border-radius:6px;font-size:.84rem;font-weight:600;color:var(--ink)}
.task-title-pill .pill-rm{border:0;background:none;cursor:pointer;color:var(--muted);font-size:.9rem;line-height:1}
.task-title-pill .pill-rm:hover{color:var(--bad)}

/* Clean, optimized, high-visibility Task Preview */
.preview-box-clean{display:grid;gap:8px;max-height:420px;overflow-y:auto;padding:2px}
.preview-task-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-left:3.5px solid var(--brand);border-radius:10px;transition:all .15s}
.preview-task-row:hover{border-color:var(--line2)}
.preview-task-row.is-team{border-left-color:var(--info)}
.preview-task-main{flex:1;min-width:0}
.preview-task-title{font-weight:600;font-size:.92rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-task-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;align-items:center}
.preview-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600}
.preview-tag.self{background:var(--brand-s);color:var(--brand-d)}
.preview-tag.team{background:var(--info-s);color:var(--info)}
.preview-tag.steps{background:var(--soft);color:var(--muted)}

/* Prominent, large template preview card */
.template-preview-card{position:relative;background:var(--surface);border:1.5px solid var(--line2);border-left:4px solid var(--warn);border-radius:12px;padding:14px 16px;display:grid;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.tpl-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tpl-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--warn-s);color:var(--warn);font-size:.76rem;font-weight:700}
.tpl-recipients-pill{font-size:.8rem;color:var(--muted);font-weight:600}
.tpl-card-title{font-size:1.02rem;font-weight:700;color:var(--ink);line-height:1.3}
.tpl-card-desc{font-size:.84rem;color:var(--muted);line-height:1.4;white-space:pre-line}
.tpl-card-steps{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.tpl-steps-list{list-style:disc;margin:4px 0 0 16px;padding:0;font-size:.82rem;color:var(--ink);display:grid;gap:2px}
.tpl-rm-btn{position:absolute;top:10px;right:10px;color:var(--muted)}
.tpl-rm-btn:hover{color:var(--bad)}

/* ================= Pro Analytics Dashboard ================= */
:root{--nx-indigo:#4f46e5;--nx-indigo-s:rgba(79,70,229,.12);--nx-sky:#0284c7;--nx-sky-s:rgba(2,132,199,.12);--nx-emerald:#10b981;--nx-emerald-s:rgba(16,185,129,.13);--nx-amber:#f59e0b;--nx-amber-s:rgba(245,158,11,.14);--nx-rose:#ef4444;--nx-rose-s:rgba(239,68,68,.13);--nx-slate:#475569}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--nx-indigo:#818cf8;--nx-indigo-s:rgba(129,140,248,.16);--nx-sky:#38bdf8;--nx-sky-s:rgba(56,189,248,.16);--nx-emerald:#34d399;--nx-emerald-s:rgba(52,211,153,.16);--nx-amber:#fbbf24;--nx-amber-s:rgba(251,191,36,.16);--nx-rose:#f87171;--nx-rose-s:rgba(248,113,113,.16);--nx-slate:#94a3b8}}
:root[data-theme=dark]{--nx-indigo:#818cf8;--nx-indigo-s:rgba(129,140,248,.16);--nx-sky:#38bdf8;--nx-sky-s:rgba(56,189,248,.16);--nx-emerald:#34d399;--nx-emerald-s:rgba(52,211,153,.16);--nx-amber:#fbbf24;--nx-amber-s:rgba(251,191,36,.16);--nx-rose:#f87171;--nx-rose-s:rgba(248,113,113,.16);--nx-slate:#94a3b8}

.nx-shell{display:grid;gap:16px;width:100%;max-width:100%;min-width:0}
.nx-shell > *{min-width:0;max-width:100%}

.nx-topbar{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px 0;display:grid;gap:14px;box-shadow:0 2px 12px rgba(15,23,42,.04);overflow:hidden}
.nx-toprow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.nx-title h2{margin:0;font-size:1.28rem;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.nx-title p{margin:3px 0 0;font-size:.84rem;color:var(--muted)}
.nx-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.nx-filters{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.nx-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nx-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--nx-indigo-s);color:var(--nx-indigo);font-size:.8rem;font-weight:600}
.nx-chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0;font-size:.9rem;line-height:1}

.nx-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:0;border-top:1px solid var(--line);margin:0 -20px;padding:6px 20px 0;background:linear-gradient(180deg,transparent,rgba(15,23,42,.015))}
.nx-tabs::-webkit-scrollbar{display:none}
.nx-tab{flex:0 0 auto;position:relative;display:inline-flex;align-items:center;gap:7px;padding:11px 15px 13px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap;border-radius:10px 10px 0 0;transition:color .15s,background .15s}
.nx-tab:hover{color:var(--ink);background:var(--hover)}
.nx-tab[aria-pressed=true]{color:var(--nx-indigo);background:transparent}
.nx-tab[aria-pressed=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--nx-indigo)}
.nx-tab-cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--soft);color:var(--muted)}
.nx-tab[aria-pressed=true] .nx-tab-cnt{background:var(--nx-indigo-s);color:var(--nx-indigo)}
.nx-tab-cnt.alert{background:var(--nx-rose-s);color:var(--nx-rose)}

.nx-hero{background:linear-gradient(135deg,#0f172a 0%,#1e293b 55%,#312e81 100%);color:#f8fafc;border-radius:18px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;box-shadow:0 10px 28px rgba(15,23,42,.18)}
.nx-hero-text{flex:1 1 280px;min-width:0}
.nx-hero-kicker{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:.76rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#c7d2fe;margin-bottom:8px}
.nx-hero h3{margin:0;font-size:1.2rem;font-weight:700;line-height:1.35;color:#fff}
.nx-hero p{margin:6px 0 0;font-size:.9rem;color:#cbd5e1;line-height:1.45}
.nx-hero-gauge{flex:none;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 16px}
.nx-hero-gauge strong{display:block;font-size:1.35rem;line-height:1.1;color:#fff}
.nx-hero-gauge span{font-size:.78rem;color:#cbd5e1}

.nx-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.nx-kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:grid;gap:6px;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.nx-kpi:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 8px 20px rgba(15,23,42,.06)}
.nx-kpi[aria-pressed=true]{box-shadow:0 0 0 2px var(--nx-indigo);border-color:var(--nx-indigo)}
.nx-kpi-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nx-kpi-lbl{font-size:.82rem;font-weight:600;color:var(--muted)}
.nx-kpi-dot{width:10px;height:10px;border-radius:50%;flex:none}
.nx-kpi-val{font-size:1.9rem;font-weight:700;line-height:1.05;color:var(--ink)}
.nx-kpi-sub{font-size:.78rem;color:var(--muted)}
.nx-kpi.k-indigo .nx-kpi-dot{background:var(--nx-indigo)}
.nx-kpi.k-amber .nx-kpi-dot{background:var(--nx-amber)}
.nx-kpi.k-sky .nx-kpi-dot{background:var(--nx-sky)}
.nx-kpi.k-emerald .nx-kpi-dot{background:var(--nx-emerald)}
.nx-kpi.k-rose .nx-kpi-dot{background:var(--nx-rose)}
.nx-kpi.k-rose{background:linear-gradient(180deg,var(--surface) 50%,var(--nx-rose-s) 150%)}

.nx-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.nx-grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.nx-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:14px;align-content:start;min-width:0;overflow:hidden}
.nx-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nx-card-head h3{margin:0;font-size:1.04rem;font-weight:700;color:var(--ink)}
.nx-card-head small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}

.nx-donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.nx-donut-svg{width:168px;height:168px;flex:none}
.nx-legend{flex:1 1 180px;display:grid;gap:10px;min-width:0}
.nx-leg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem;padding:7px 10px;border-radius:10px;background:var(--paper);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.nx-leg-row:hover{border-color:var(--line2);background:var(--hover)}
.nx-leg-left{display:flex;align-items:center;gap:8px;min-width:0}
.nx-leg-sw{width:11px;height:11px;border-radius:3px;flex:none}
.nx-leg-name{font-weight:600;color:var(--ink)}
.nx-leg-right{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.nx-leg-right b{font-size:.96rem;color:var(--ink)}
.nx-leg-right span{font-size:.78rem;color:var(--muted)}

.nx-hbar-list{display:grid;gap:11px}
.nx-hbar-btn{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:background .15s,border-color .15s}
.nx-hbar-btn:hover{background:var(--hover);border-color:var(--line2)}
.nx-hbar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.88rem;font-weight:600}
.nx-hbar-track{height:9px;border-radius:999px;background:var(--track);overflow:hidden;display:flex}
.nx-hbar-track i{display:block;height:100%;transition:width .35s ease}
.nx-hbar-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}

.nx-chart-box{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nx-chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.nx-chart-legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.nx-chart-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.nx-mini-list{display:grid;gap:8px}
.nx-mini-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.nx-mini-item:hover{background:var(--hover);border-color:var(--line2)}
.nx-mini-main{min-width:0;flex:1}
.nx-mini-title{font-weight:600;font-size:.9rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx-mini-sub{font-size:.78rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap;flex:none}
.nx-pill.rose{background:var(--nx-rose-s);color:var(--nx-rose)}
.nx-pill.amber{background:var(--nx-amber-s);color:var(--warn)}
.nx-pill.emerald{background:var(--nx-emerald-s);color:var(--ok)}
.nx-pill.sky{background:var(--nx-sky-s);color:var(--nx-sky)}
.nx-pill.indigo{background:var(--nx-indigo-s);color:var(--nx-indigo)}

.nx-staff-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:grid;gap:11px;transition:border-color .15s,box-shadow .15s}

function svgDonutChart(segments, centerValue, centerLabel) {
  const r = 54, c = 2 * Math.PI * r;
  const total = segments.reduce((a, s) => a + Math.max(0, s.value || 0), 0);
  let acc = 0;
  const arcs = total ? segments.filter(s => s.value > 0).map(s => {
    const len = (s.value / total) * c;
    const dash = `${len.toFixed(2)} ${(c - len).toFixed(2)}`;
    const offset = (-acc).toFixed(2);
    acc += len;
    return `<circle cx="72" cy="72" r="${r}" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${dash}" stroke-dashoffset="${offset}" stroke-linecap="butt" transform="rotate(-90 72 72)"/>`;
  }).join('') : '';
  return raw(`<svg class="nx-donut-svg" viewBox="0 0 144 144" role="img" aria-label="${centerLabel}: ${centerValue}">
    <circle cx="72" cy="72" r="${r}" fill="none" stroke="var(--track)" stroke-width="18"/>
    ${arcs}
    <text x="72" y="70" text-anchor="middle" fill="var(--ink)" font-size="23" font-weight="700" class="num">${centerValue}</text>
    <text x="72" y="88" text-anchor="middle" fill="var(--muted)" font-size="11" font-weight="600">${centerLabel}</text>
  </svg>`);
}

function svgGauge(percent) {
  const p = Math.max(0, Math.min(100, Number(percent) || 0));
  const r = 24, c = 2 * Math.PI * r, len = (p / 100) * c;
  return raw(`<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true">
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 30 30)"/>
    <text x="30" y="34" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">${Math.round(p)}%</text>
  </svg>`);
}

function svgColumnChart(items, emptyText) {
  const rows = (items || []).slice(-6);
  if (!rows.length) return h`<div class="empty" style="padding:28px 16px">${emptyText || 'No activity data yet.'}</div>`;
  const w = 440, hgt = 190, padL = 30, padR = 12, padT = 20, padB = 30;
  const maxVal = Math.max(2, ...rows.map(r => Math.max(r.created || 0, r.completed || 0)));
  const chartW = w - padL - padR, chartH = hgt - padT - padB;
  const slotW = chartW / rows.length;
  const barW = Math.min(18, Math.max(9, Math.floor((slotW - 14) / 2)));

  let grid = '';
  for (let i = 0; i <= 3; i++) {
    const val = Math.round((maxVal * i) / 3);
    const y = padT + chartH - (chartH * i) / 3;
    grid += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="var(--line)" stroke-dasharray="${i === 0 ? '' : '3 3'}"/>`;
    grid += `<text x="${padL - 6}" y="${y + 4}" text-anchor="end" fill="var(--muted)" font-size="10">${val}</text>`;
  }

  const mNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const bars = rows.map((r, i) => {
    const cx = padL + slotW * i + slotW / 2;
    const hC = Math.round(((r.created || 0) / maxVal) * chartH);
    const hD = Math.round(((r.completed || 0) / maxVal) * chartH);
    const yC = padT + chartH - hC, yD = padT + chartH - hD;
    const rawLbl = String(r.label || r.month || '');
    const mm = rawLbl.match(/^(\d{4})-(\d{2})$/);
    const lbl = mm ? (mNames[Number(mm[2]) - 1] || mm[2]) + " '" + mm[1].slice(2) : rawLbl;
    return `
      <rect x="${cx - barW - 2}" y="${yC}" width="${barW}" height="${Math.max(2, hC)}" rx="4" fill="var(--nx-indigo)"><title>${lbl}: ${r.created} added</title></rect>
      ${r.created ? `<text x="${cx - barW / 2 - 2}" y="${Math.max(11, yC - 4)}" text-anchor="middle" fill="var(--ink)" font-size="10" font-weight="700">${r.created}</text>` : ''}
      <rect x="${cx + 2}" y="${yD}" width="${barW}" height="${Math.max(2, hD)}" rx="4" fill="var(--nx-emerald)"><title>${lbl}: ${r.completed} finished</title></rect>
      ${r.completed ? `<text x="${cx + barW / 2 + 2}" y="${Math.max(11, yD - 4)}" text-anchor="middle" fill="var(--nx-emerald)" font-size="10" font-weight="700">${r.completed}</text>` : ''}
      <text x="${cx}" y="${hgt - 8}" text-anchor="middle" fill="var(--muted)" font-size="10.5" font-weight="600">${lbl}</text>`;
  }).join('');

  return h`<div style="display:grid;gap:10px">
    <div class="nx-chart-box"><svg viewBox="0 0 ${w} ${hgt}" style="width:100%;min-width:290px;max-height:210px;display:block">${raw(grid + bars)}</svg></div>
    <div class="nx-chart-legend">
      <span><i style="background:var(--nx-indigo)"></i> New Tasks Added</span>
      <span><i style="background:var(--nx-emerald)"></i> Tasks Finished</span>
    </div>
  </div>`;
}

async function loadDashboard(silent) {
  const seq = ++S.dashSeq;
  const pageOffset = Number(S.dashFilters.offset) || 0, previous = S.dashboard;
  if (!silent) { S.dashboard = null; paintDashboard(); }
  try {
    const d = await api('apiDashboardData', S.token, S.dashFilters);
    if (seq !== S.dashSeq || S.view !== 'dashboard') return;
    if (pageOffset && previous && previous.drilldown && d.drilldown) {
      d.drilldown.tasks = previous.drilldown.tasks.concat(d.drilldown.tasks);
    }
    S.dashboard = d;
    renderDashboardShell();
  } catch (e) {
    if (e.auth || seq !== S.dashSeq) return;
    toast(e.message, true);
  }
}

function selectedTargets() {
  const me = S.boot.user, by = {}; (S.boot.people || []).forEach(p => { by[p.c] = p; });
  const canAssignOthers = !!(me.isNazim || me.isAdmin);
  const targets = [];
  
  if (!canAssignOthers || S.draft.targetMode === 'self') {
    targets.push(by[me.EmpCode] || { c: me.EmpCode, n: me.EmpName, r: me.Role, d: me.Division, g: me.Region });
    if (canAssignOthers && S.draft.alsoTeam) {
      (S.draft.assignees || new Set()).forEach(code => {
        if (code !== me.EmpCode && by[code]) targets.push(by[code]);
      });
    }
  } else if (S.draft.targetMode === 'team') {
    (S.draft.assignees || new Set()).forEach(code => {
      if (code !== me.EmpCode && by[code]) targets.push(by[code]);
    });
    if (S.draft.includeSelf) {
      targets.push(by[me.EmpCode] || { c: me.EmpCode, n: me.EmpName, r: me.Role, d: me.Division, g: me.Region });
    }
  }
  return targets;
}

function selectedTemplateEntries() {
  const targets = selectedTargets(), entries = [], warnings = [];
  const list = TPL.list || [];
  Object.keys(S.draft.tpl || {}).forEach(roleKey => {
    const set = S.draft.tpl[roleKey];
    if (!set) return;
    set.forEach(id => {
      const template = list.find(t => t.id === id);
      if (!template) { warnings.push('A selected template is no longer available.'); return; }
      let recipients = targets.filter(p => p.r === roleKey);
      if (!recipients.length || roleKey === 'general' || roleKey === 'all' || template.all || !template.roles.length) {
        recipients = targets.length ? targets : [];
      }
      recipients.forEach(p => entries.push({ role: p.r || roleKey, id, template, target: p }));
    });
  });
  return { entries, warnings: Array.from(new Set(warnings)) };
}

function templateGroups() {
  const byTid = {};
  selectedTemplateEntries().entries.forEach(x => {
    if (!byTid[x.id]) byTid[x.id] = { templateIds: [x.id], assignedTo: [] };
    if (!byTid[x.id].assignedTo.includes(x.target.c)) byTid[x.id].assignedTo.push(x.target.c);
  });
  return Object.values(byTid);
}

function paintTemplateCount() {
  const el = $('#n-tpl-count'); if (!el) return;
  const g = templateGroups(), n = g.reduce((a, x) => a + x.templateIds.length * x.assignedTo.length, 0);
  el.textContent = n ? n + (n === 1 ? ' template queued' : ' templates queued') : '';
}

/* ---- task templates (New task form) ---- */
const TPL = { list: null };

async function loadTemplates() {
  TPL.list = null;
  try {
    const r = await api('apiTaskTemplates', S.token);
    TPL.list = r.templates || [];
  } catch (e) {
    TPL.list = [];
    if (!e.auth) toast('Templates could not be loaded. You can still type tasks.', true);
  }
  paintTemplates();
}

function paintTemplates() {
  const field = $('#n-tpl-field'), box = $('#n-tpl-list'); if (!field || !box) return;
  const list = TPL.list;
  if (list === null) {
    mount(box, h`<div class="muted" style="padding:12px;text-align:center">Loading templates…</div>`);
    return;
  }
  if (!list.length) {
    mount(box, h`<div class="muted" style="padding:10px;text-align:center;font-size:.84rem">No active templates found. You can add templates in Admin.</div>`);
    paintTemplateCount();
    paintDraftPreview();
    return;
  }

  const q = ($('#n-tpl-search') ? $('#n-tpl-search').value : '').trim().toLowerCase();
  const matchQ = t => !q || ((t.title || '') + ' ' + (t.description || '')).toLowerCase().includes(q);

  const targets = selectedTargets();
  const byRole = {};
  targets.forEach(p => { if (p && p.r) (byRole[p.r] = byRole[p.r] || []).push(p); });
  const targetRoles = Object.keys(byRole).sort();

  const renderedIds = new Set();
  const groupsToRender = [];

  if (targetRoles.length) {
    targetRoles.forEach(role => {
      const matching = list.filter(t => (t.all || !t.roles.length || t.roles.indexOf(role) >= 0) && matchQ(t));
      if (matching.length) {
        matching.forEach(t => renderedIds.add(t.id));
        groupsToRender.push({
          roleKey: role,
          title: role,
          subtitle: byRole[role].length + (byRole[role].length === 1 ? ' employee' : ' employees'),
          templates: matching
        });
      }
    });
  }

  const otherTpls = list.filter(t => !renderedIds.has(t.id) && matchQ(t));
  if (otherTpls.length) {
    groupsToRender.push({
      roleKey: 'general',
      title: targetRoles.length ? 'Other Available Templates' : 'Available Templates',
      subtitle: otherTpls.length + (otherTpls.length === 1 ? ' template' : ' templates'),
      templates: otherTpls
    });
  }

  if (!groupsToRender.length) {
    mount(box, h`<div class="muted" style="padding:10px;text-align:center;font-size:.84rem">${q ? 'No templates match your search.' : 'No templates match current roles.'}</div>`);
  } else {
    mount(box, h`${groupsToRender.map(g => {
      return h`<div class="tpl-group">
        <div class="tpl-head"><b>${g.title}</b> <small class="muted">· ${g.subtitle}</small></div>
        ${g.templates.map(t => {
          const chosen = S.draft.tpl[g.roleKey] && S.draft.tpl[g.roleKey].has(t.id);
          return h`<label class="template-option-large" title="${t.description || ''}">

async function createTask(form, btn) {
  const err = $('#n-err'); err.hidden = true;
  addTaskTitle();

  const taskTitles = (S.draft.tasks || []).map(x => x.trim()).filter(Boolean);
  const targets = selectedTargets();
  const to = Array.from(new Set(targets.map(p => p.c)));

  if (!to.length) {
    err.textContent = 'Please select at least one recipient (yourself or employees).';
    err.hidden = false;
    return;
  }

  const draftWarnings = selectedTemplateEntries().warnings;
  if (draftWarnings.length) { err.textContent = draftWarnings.join(' '); err.hidden = false; return; }

  const tplGroups = templateGroups();
  const tplCount = tplGroups.reduce((a, g) => a + g.templateIds.length * g.assignedTo.length, 0);

  if (!taskTitles.length && !tplCount) {
    err.textContent = 'Please enter at least one task title or select a template.';
    err.hidden = false;
    $('#n-taskTitle')?.focus();
    return;
  }

  const dueDate = $('#n-due')?.value;
  if (taskTitles.length && !dueDate) {
    err.textContent = 'Please select a due date.';
    err.hidden = false;
    $('#n-due')?.focus();
    return;
  }

  const totalToCreate = taskTitles.length * to.length + tplCount;
  if (totalToCreate > 200) {
    err.textContent = 'This save would create ' + totalToCreate + ' tasks (maximum is 200). Reduce task titles or selected recipients.';
    err.hidden = false;
    return;
  }

  const notify = !!($('#n-notify')?.checked && targets.some(p => p.c !== S.boot.user.EmpCode));
  const confidential = !!$('#n-confidential')?.checked;

  await busy(btn, async () => {
    try {
      const r = await api('apiCreateTask', S.token, {
        requestId: S.draft.requestId,
        tasks: taskTitles,
        description: $('#n-desc')?.value || '',
        dueDate: dueDate || todayKey(),
        assignedTo: to,
        templateGroups: tplGroups,
        confidential,
        notify
      });
      closeDrawer(true);
      toast(r.mail ? (r.mail.error ? r.count + ' tasks created. Email error: ' + r.mail.error : r.mail.queued ? r.count + ' tasks created. Email queued.' : r.count + ' tasks created and emailed.') : r.count + (r.count === 1 ? ' task created.' : ' tasks created.'));
      await Promise.all(['mine', 'team'].filter(k => S.data[k]).map(k => loadList(k, { silent: true })));
      if (S.view === 'mine' || S.view === 'team') loadList(S.view);
      if (S.view === 'dashboard') { delete S.dashFilters.offset; await loadDashboard(); }
      setTimeout(() => {
        const el = $('.row[data-id="' + CSS.escape(r.taskId) + '"]');
        if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      }, 80);
    } catch (e) {
      err.textContent = e.message;
      err.hidden = false;
    }
  });
}
async function applyBulkStatus(scope, btn) {
  const ids = Array.from(S.selected[scope]), status = $('#bulk-status')?.value || '';
  if (!ids.length) return toast('Select at least one task.', true);
  if (!status) return toast('Choose a status to apply.', true);
  const reopening = status !== 'Completed' && ids.some(id => { const t = findTask(id); return t && t.Status === 'Completed'; });
  const remark = reopening ? window.prompt('A remark is required because this selection includes completed tasks. The remark will be recorded and emailed to each reopened task assignee.') : '';
  if (reopening && !String(remark || '').trim()) return;
  await busy(btn, async () => {
    try {
      const r = await api('apiBulkUpdateTaskStatus', S.token, ids, status, remark || '');
      S.selected[scope].clear();
      await Promise.all(['mine', 'team'].filter(k => S.data[k]).map(k => loadList(k, { silent: true })));
      const mailErrors = (r.failed || []).filter(x => /email|mail/i.test(x.reason)).length;
      toast(r.updated + ' task(s) updated.' + ((r.failed || []).length ? ' ' + r.failed.length + ' task(s) need review.' : '') + (mailErrors ? ' ' + mailErrors + ' reopen email(s) could not be sent.' : ''), !!mailErrors);
      if (r.failed && r.failed.length) console.warn('Bulk task update items needing review:', r.failed);
    } catch (e) { if (!e.auth) toast(e.message, true); }
  });
}

    busy(el, async () => {
      try {
        const r = await api('apiSendPasswordReset', S.token, code);
        toast(r.message || 'Password reset email sent.');
      } catch (e) { if (!e.auth) toast(e.message, true); }
    });
  }
};
const findSubmitBtn = f => f._btn || $(`button[data-f="${f.id}"]`) || $('button.primary', f) || $('#dfoot button.primary');
const FORMS = {
  quickadd: f => quickAdd(f), login: f => doLogin(f), savesettings: f => saveSettings(f), reopentask: f => reopenTask(f, findSubmitBtn(f)),
  changepw: f => changePassword(f),
  unlockvault: f => busy($('button', f), async () => {
    try {
      await api('apiUnlockVault', S.token, $('#uv-pw').value);
      toast('Encryption vault unlocked.');
      await Promise.all(['mine', 'team'].filter(k => S.data[k]).map(k => loadList(k, { silent: true })));
      if (S.openId) openTask(S.openId);
    } catch (e) { if (!e.auth) toast(e.message, true); }
  }),
  savetask: f => { if (!$('.pval', f).value) { const e = $('#e-err'); e.textContent = 'Choose a person from the list.'; e.hidden = false; return; } saveTask(f, findSubmitBtn(f)); },
  createtask: f => createTask(f, findSubmitBtn(f)),
  saveperson: f => savePerson(f, findSubmitBtn(f)),
  savetemplate: f => saveTemplate(f, findSubmitBtn(f))
};
document.addEventListener('click', e => {
  $$('.plist').forEach(u => { if (!u.parentElement.contains(e.target)) u.hidden = true; });
  if (e.target === $('#scrim')) return closeDrawer();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f, e); });
document.addEventListener('keydown', e => {
  if (isAckLocked()) { if (e.key === 'Escape') e.preventDefault(); return; }
  const isInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName);
  const isDrawerOpen = $('#drawer') && $('#drawer').classList.contains('open');

  if (e.key === 'Escape') {
    if (!$('.plist').every(u => u.hidden)) { $('.plist').forEach(u => { u.hidden = true; }); return; }
    if (isDrawerOpen) { closeDrawer(); return; }
    if (S.selected && S.selected[S.view] && S.selected[S.view].size) { S.selected[S.view].clear(); renderList(S.view); return; }
    if (isInput) { document.activeElement.blur(); return; }
    return;
  }
  if ((e.key === 'n' || e.key === 'N') && !isInput && !isDrawerOpen && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (S.token && S.boot) { e.preventDefault(); newTask(); return; }
  }
  if (e.key === '/' && !isInput && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const sInp = $('input[data-k="search"]') || $('#dashsearch') || $('input[type="search"]') || $('#qa-t');
    if (sInp && sInp.offsetParent !== null) {
      e.preventDefault();
      sInp.focus();
      sInp.select();
      return;
    }
  }
  if (e.key === '?' && !isInput && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    openShortcutsModal();
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.row,.tbl tr.click')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'n-taskTitle') { e.preventDefault(); addTaskTitle(); }
});
const applyFilter = debounce((scope) => loadList(scope, { silent: true }), 300);
const applyDraftPreview = debounce(() => paintDraftPreview(), 150);
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in === 'filter') { const f = S.filters[S.view], v = el.value.trim(); if (v) f[el.dataset.k] = v; else delete f[el.dataset.k]; applyFilter(S.view); }
  else if (el.dataset.in === 'pick') { const box = el.closest('.picker'); $('.pval', box).value = ''; pickerShow(box); }
  else if (el.dataset.in === 'peopleq') { S.admin.q = el.value; paintPeople(); }
  else if (el.dataset.in === 'dashsearch') { S.dashSearch = el.value; const b = $('#dashboard-content'); if (b && S.dashboard && S.dashTab === 'team') paintDashboardTeam(b, S.dashboard); }
  else if (el.dataset.in === 'dashtasksearch') { S.dashTaskQuery = el.value; const b = $('#dashboard-content'); if (b && S.dashboard && S.dashTab === 'tasks') paintDashboardTasks(b, S.dashboard); }
  else if (el.id === 'n-people-search') paintAssignees();
  else if (el.id === 'n-tpl-search') paintTemplates();
  else if (el.id === 'n-taskTitle') applyDraftPreview();
  else if (el.id === 'n-due') applyDraftPreview();
  else if (el.dataset.bind) bindChange(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.ch === 'filter') { const f = S.filters[S.view]; if (el.value) f[el.dataset.k] = el.value; else delete f[el.dataset.k]; loadList(S.view, { silent: true }); }
  else if (el.dataset.ch === 'dashfilter') { if (el.value) S.dashFilters[el.dataset.k] = el.value; else delete S.dashFilters[el.dataset.k]; delete S.dashFilters.offset; loadDashboard(); }
  else if (el.id === 'n-due') paintDraftPreview();
  else if (el.dataset.ch === 'assignee') {
    if (el.checked) S.draft.assignees.add(el.dataset.c);
    else S.draft.assignees.delete(el.dataset.c);
    paintAssignees();
    paintDraftPreview();
  }
  else if (el.dataset.ch === 'tpl') { const r = el.dataset.role, set = S.draft.tpl[r] || (S.draft.tpl[r] = new Set()); if (el.checked) set.add(el.dataset.id); else { set.delete(el.dataset.id); if (!set.size) delete S.draft.tpl[r]; } paintTemplates(); }
  else if (el.dataset.ch === 'tplall') $$('input[name="tp-role"]').forEach(x => { x.disabled = el.checked; });
  else if (el.dataset.ch === 'tplactive') {
    const id = el.dataset.id, on = el.checked;
    api('apiSetTemplateActive', S.token, id, on).then(() => { const t = (S.admin.tpls || []).find(x => x.id === id); if (t) t.active = on; toast(on ? 'Template is on.' : 'Template is off.'); })
      .catch(e => { el.checked = !on; if (!e.auth) toast(e.message, true); });
  }
  else if (el.dataset.bind) bindChange(el);
});
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('pin')) pickerShow(e.target.closest('.picker')); });
function bindChange(el) {
  const kind = el.dataset.bind, i = Number(el.dataset.i), k = el.dataset.k;
  if (kind === 'roles') { const r = S.admin.roles[i]; r[k] = el.type === 'checkbox' ? el.checked : (k === 'Level' ? Number(el.value) : el.value); }
  else if (kind === 'sched') {
    const s = S.admin.sched[i];
    if (k === 'Active') s.Active = el.checked ? 'Y' : 'N';
    else if (k === 'repeat') { if (el.value === 'week') { s.DayOfWeek = 1; s.DayOfMonth = ''; } else { s.DayOfMonth = 1; s.DayOfWeek = ''; } paintSched(); }
    else if (k === 'DayOfWeek' || k === 'DayOfMonth') s[k] = Number(el.value);
    else s[k] = el.value;
  }
}

/* ================= start ================= */
async function start() {
  applyPrefs();
  const needsConfig = !window.FIREBASE_CONFIG || window.FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY';
  if (needsConfig) return showLogin();
  const tok = store.get('tm.token');
  if (!tok) return showLogin();
  S.token = tok;
  mount($('#root'), h`<aside class="rail"><header class="top"><div class="brand">Task Management</div></header></aside><main class="page"><div class="chips"><div class="sk" style="height:36px;width:90px;border-radius:999px"></div><div class="sk" style="height:36px;width:110px;border-radius:999px"></div><div class="sk" style="height:36px;width:100px;border-radius:999px"></div></div>${skeletonRows(5)}</main>`);
  try { const r = await api('apiBootstrap', tok); if (r.newToken) { S.token = r.newToken; store.set('tm.token', r.newToken); } enter(r); }
  catch (e) { if (!e.auth) mount($('#root'), h`<main class="login"><div class="login-card"><h1>Could not connect</h1><p class="muted">${e.message}</p><div class="actions"><button class="btn primary" data-act="restart">Try again</button><button class="btn" data-act="signout">Sign in again</button></div></div></main>`); }
}
start();
})();
</script>
</body>
</html>
