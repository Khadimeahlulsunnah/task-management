  ];
  const tasks = d.tasks || [];
  const moveButtons = t => {
    if (!t.CanUpdate) return '';
    if (t.NeedsAck) return h`<button type="button" class="kb-mv" data-act="acktask" data-id="${t.TaskID}" data-busy="…">✓ Start</button>`;
    const lockPending = !t.SelfAssigned && !t.CanManage && !!t.ReceivedAt;
    const btns = [];
    if (t.Status === 'Pending') {
      btns.push(h`<button type="button" class="kb-mv" data-act="kbmove" data-id="${t.TaskID}" data-s="In Progress">Start →</button>`);
      btns.push(h`<button type="button" class="kb-mv" data-act="kbmove" data-id="${t.TaskID}" data-s="Completed">Done ✓</button>`);
    } else if (t.Status === 'In Progress') {
      if (!lockPending) btns.push(h`<button type="button" class="kb-mv" data-act="kbmove" data-id="${t.TaskID}" data-s="Pending">← Pending</button>`);
      btns.push(h`<button type="button" class="kb-mv" data-act="kbmove" data-id="${t.TaskID}" data-s="Completed">Done ✓</button>`);
    } else {
      btns.push(h`<button type="button" class="kb-mv" data-act="kbmove" data-id="${t.TaskID}" data-s="In Progress">Reopen</button>`);
    }
    return h`${btns}`;
  };
  return h`<div class="kb-board" role="region" aria-label="Task Kanban board">${cols.map(c => {
    const items = tasks.filter(t => t.Status === c.status);
    return h`<section class="kb-col" data-col="${c.status}">
      <div class="kb-col-head">

      </div>
      <div class="kb-list">
        ${items.length ? items.map(t => {
          const cls = t.Status === 'Completed' ? 'is-done' : t.Overdue ? 'is-over' : t.Status === 'In Progress' ? 'is-prog' : '';
          return h`<article class="kb-card ${cls}" data-act="open" data-id="${t.TaskID}" draggable="${t.CanUpdate ? 'true' : 'false'}" tabindex="0">
            <div class="kb-card-top">
              <div style="display:flex;align-items:center;gap:6px;min-width:0">
                ${t.Priority && t.Priority !== 'Normal' ? priBadge(t.Priority) : h`<span class="muted" style="font-size:.72rem">${t.TaskID}</span>`}
              </div>
              <div style="display:flex;align-items:center;gap:6px">
                <span class="due" style="font-size:.76rem;min-width:0;${t.Overdue ? 'color:var(--bad);font-weight:700' : ''}">${dueText(t)}</span>
                <input class="select-task" type="checkbox" data-act="selecttask" data-id="${t.TaskID}" aria-label="Select ${t.Title}" ${t.CanUpdate ? '' : 'disabled'} ${S.selected[scope].has(t.TaskID) ? 'checked' : ''}>
              </div>
            </div>
            <div class="kb-title">${t.DecryptLocked ? IC.lock : ''}${t.DecryptLocked ? ' ' : ''}${t.Title}</div>
            <div class="kb-meta">
              <span>${scope === 'team' ? t.AssignedToName : taskOrigin(t)}</span>
              ${scope === 'team' && t.Division ? h`<span>${t.Division}</span>` : ''}
            </div>
            <div class="kb-foot">
              <div class="kb-moves">${moveButtons(t)}</div>

function selectedTargets() {
  const me = S.boot.user, by = {}; (S.boot.people || []).forEach(p => { by[p.c] = p; });
  const canAssignOthers = !!(me.isNazim || me.isAdmin);
  const targets = [];
  
  if (!canAssignOthers || S.draft.targetMode === 'self') {
    targets.push(by[me.EmpCode] || { c: me.EmpCode, n: me.EmpName, r: me.Role, d: me.Division, g: me.Region });
    if (canAssignOthers && S.draft.alsoTeam) {
      (S.draft.assignees || new Set()).forEach(code => {
        if (code !== me.EmpCode && by[code]) targets.push(by[code]);
      });
    }
  } else if (S.draft.targetMode === 'team') {
    (S.draft.assignees || new Set()).forEach(code => {
      if (code !== me.EmpCode && by[code]) targets.push(by[code]);
    });
    if (S.draft.includeSelf) {
      targets.push(by[me.EmpCode] || { c: me.EmpCode, n: me.EmpName, r: me.Role, d: me.Division, g: me.Region });
    }
  }
  return targets;
}

function selectedTemplateEntries() {
  const targets = selectedTargets(), entries = [], warnings = [];
  const list = TPL.list || [];
  Object.keys(S.draft.tpl || {}).forEach(roleKey => {
    const set = S.draft.tpl[roleKey];
    if (!set) return;
    set.forEach(id => {
      const template = list.find(t => t.id === id);
      if (!template) { warnings.push('A selected template is no longer available.'); return; }
      let recipients = targets.filter(p => p.r === roleKey);
      if (!recipients.length || roleKey === 'general' || roleKey === 'all' || template.all || !template.roles.length) {
        recipients = targets.length ? targets : [];
      }
      recipients.forEach(p => entries.push({ role: p.r || roleKey, id, template, target: p }));
    });
  });
  return { entries, warnings: Array.from(new Set(warnings)) };
}

function templateGroups() {
  const byTid = {};
  selectedTemplateEntries().entries.forEach(x => {
    if (!byTid[x.id]) byTid[x.id] = { templateIds: [x.id], assignedTo: [] };
    if (!byTid[x.id].assignedTo.includes(x.target.c)) byTid[x.id].assignedTo.push(x.target.c);
  });
  return Object.values(byTid);
}

function paintTemplateCount() {
  const el = $('#n-tpl-count'); if (!el) return;
  const g = templateGroups(), n = g.reduce((a, x) => a + x.templateIds.length * x.assignedTo.length, 0);
  el.textContent = n ? n + (n === 1 ? ' template queued' : ' templates queued') : '';
}

function paintDraft() {

function syncPriorityUi() {
  const seg = $('#n-prio-seg'); if (!seg || !S.boot) return;
  const me = S.boot.user, targets = selectedTargets();
  const canAssignOthers = !!(me.isNazim || me.isAdmin);
  const includesSelf = targets.some(p => p.c === me.EmpCode);
  const allowHigh = canAssignOthers && !includesSelf && targets.length > 0;
  if (!allowHigh && (S.draft.priority === 'Urgent' || S.draft.priority === 'High')) S.draft.priority = 'Normal';
  const cur = S.draft.priority || 'Normal';
  seg.classList.toggle('is-2', !allowHigh);
  $$('.pri-btn', seg).forEach(b => {
    const p = b.dataset.p;
    const hideBtn = !allowHigh && (p === 'Urgent' || p === 'High');
    b.hidden = hideBtn;
    b.disabled = hideBtn;
    b.setAttribute('aria-pressed', String(p === cur));
  });
  const hint = $('#n-prio-hint');
  if (hint) {
    const lim = (S.boot.app && S.boot.app.priorityLimits) || { Urgent: 3, High: 5, Normal: 25, Low: 20 };
    if (!allowHigh) {
      hint.hidden = !canAssignOthers;
      hint.textContent = canAssignOthers ? 'Self-tasks use Normal or Low priority.' : '';
    } else {
      hint.hidden = false;
      hint.textContent = `Limits per employee: Urgent ${lim.Urgent} · High ${lim.High} · Normal ${lim.Normal || '∞'} · Low ${lim.Low || '∞'} active tasks.`;
    }
  }
}

function paintDraftPreview() {
  syncPriorityUi();
  const box = $('#n-preview'); if (!box) return;
  const targets = selectedTargets(), me = S.boot.user;
  const { entries, warnings } = selectedTemplateEntries();

  const currentTyped = ($('#n-taskTitle')?.value || '').trim();
  const manual = (S.draft.tasks || []).map(x => x.trim()).filter(Boolean);
  if (currentTyped && !manual.includes(currentTyped)) manual.push(currentTyped);

  const selfTarget = targets.find(p => p.c === me.EmpCode);
  const employeeTargets = targets.filter(p => p.c !== me.EmpCode);

  const selfManualCount = selfTarget ? manual.length : 0;
  const teamManualCount = employeeTargets.length * manual.length;
  const templateCount = entries.length;
  const totalTasks = selfManualCount + teamManualCount + templateCount;

  const dueVal = $('#n-due')?.value || todayKey();

  const tplGroups = {};
  entries.forEach(e => {
    if (!tplGroups[e.id]) tplGroups[e.id] = { id: e.id, template: e.template, role: e.role, targets: [] };
    tplGroups[e.id].targets.push(e.target);
  });

  const badge = $('#n-preview-badge');
  if (badge) badge.textContent = totalTasks ? `${totalTasks} task${totalTasks === 1 ? '' : 's'}` : '0 tasks';

  mount(box, h`
    ${totalTasks === 0 ? h`

const TPL = { list: null };

async function loadTemplates() {
  TPL.list = null;
  try {
    const r = await api('apiTaskTemplates', S.token);
    TPL.list = r.templates || [];
  } catch (e) {
    TPL.list = [];
    if (!e.auth) toast('Templates could not be loaded. You can still type tasks.', true);
  }
  paintTemplates();
}

function paintTemplates() {
  const field = $('#n-tpl-field'), box = $('#n-tpl-list'); if (!field || !box) return;
  const list = TPL.list;
  if (list === null) {
    mount(box, h`<div class="muted" style="padding:12px;text-align:center">Loading templates…</div>`);
    return;
  }
  if (!list.length) {
    mount(box, h`<div class="muted" style="padding:10px;text-align:center;font-size:.84rem">No active templates found. You can add templates in Admin.</div>`);
    paintTemplateCount();
    paintDraftPreview();
    return;
  }

  const q = ($('#n-tpl-search') ? $('#n-tpl-search').value : '').trim().toLowerCase();
  const matchQ = t => !q || ((t.title || '') + ' ' + (t.description || '')).toLowerCase().includes(q);

  const targets = selectedTargets();
  const byRole = {};
  targets.forEach(p => { if (p && p.r) (byRole[p.r] = byRole[p.r] || []).push(p); });
  const targetRoles = Object.keys(byRole).sort();

  const renderedIds = new Set();
  const groupsToRender = [];

  if (targetRoles.length) {
    targetRoles.forEach(role => {
      const matching = list.filter(t => (t.all || !t.roles.length || t.roles.indexOf(role) >= 0) && matchQ(t));
      if (matching.length) {
        matching.forEach(t => renderedIds.add(t.id));
        groupsToRender.push({
          roleKey: role,
          title: role,
          subtitle: byRole[role].length + (byRole[role].length === 1 ? ' employee' : ' employees'),
          templates: matching
        });
      }
    });
  }

  const otherTpls = list.filter(t => !renderedIds.has(t.id) && matchQ(t));
  if (otherTpls.length) {
    groupsToRender.push({
      roleKey: 'general',
      title: targetRoles.length ? 'Other Available Templates' : 'Available Templates',
      subtitle: otherTpls.length + (otherTpls.length === 1 ? ' template' : ' templates'),
      templates: otherTpls
    });
  }

  if (!groupsToRender.length) {
    mount(box, h`<div class="muted" style="padding:10px;text-align:center;font-size:.84rem">${q ? 'No templates match your search.' : 'No templates match current roles.'}</div>`);
  } else {
    mount(box, h`${groupsToRender.map(g => {
      return h`<div class="tpl-group">
        <div class="tpl-head"><b>${g.title}</b> <small class="muted">· ${g.subtitle}</small></div>
        ${g.templates.map(t => {
          const chosen = S.draft.tpl[g.roleKey] && S.draft.tpl[g.roleKey].has(t.id);
          return h`<label class="template-option-large" title="${t.description || ''}">
            <input type="checkbox" data-ch="tpl" data-role="${g.roleKey}" data-id="${t.id}" ${chosen ? 'checked' : ''}>
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:.9rem;color:var(--ink)">${t.title}</div>
              ${t.description ? h`<div style="font-size:.8rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.description}</div>` : ''}
              ${t.all || !t.roles.length ? h`<div style="display:flex;gap:6px;align-items:center;margin-top:4px;font-size:.76rem;color:var(--muted)"><span class="badge" style="background:var(--soft);color:var(--ink)">All roles</span></div>` : ''}
            </div>
          </label>`;
        })}
      </div>`;
    })}`);
  }

  paintTemplateCount();
  paintDraftPreview();
}

async function createTask(form, btn) {
  const err = $('#n-err'); err.hidden = true;
  addTaskTitle();

  const taskTitles = (S.draft.tasks || []).map(x => x.trim()).filter(Boolean);
  const targets = selectedTargets();
  const to = Array.from(new Set(targets.map(p => p.c)));

  if (!to.length) {
    err.textContent = 'Please select at least one recipient (yourself or employees).';
    err.hidden = false;
    return;
  }

  const draftWarnings = selectedTemplateEntries().warnings;
  if (draftWarnings.length) { err.textContent = draftWarnings.join(' '); err.hidden = false; return; }

  const tplGroups = templateGroups();
  const tplCount = tplGroups.reduce((a, g) => a + g.templateIds.length * g.assignedTo.length, 0);

  if (!taskTitles.length && !tplCount) {
    err.textContent = 'Please enter at least one task title or select a template.';
    err.hidden = false;
    $('#n-taskTitle')?.focus();
    return;
  }

  const dueDate = $('#n-due')?.value;
  if (taskTitles.length && !dueDate) {
    err.textContent = 'Please select a due date.';
    err.hidden = false;
    $('#n-due')?.focus();
    return;
  }

  const totalToCreate = taskTitles.length * to.length + tplCount;
  if (totalToCreate > 200) {
    err.textContent = 'This save would create ' + totalToCreate + ' tasks (maximum is 200). Reduce task titles or selected recipients.';
    err.hidden = false;
    return;
  }

  const notify = !!($('#n-notify')?.checked && targets.some(p => p.c !== S.boot.user.EmpCode));
  const confidential = true;

  await busy(btn, async () => {
    try {
      const r = await api('apiCreateTask', S.token, {
        requestId: S.draft.requestId,
        tasks: taskTitles,
        description: $('#n-desc')?.value || '',
        dueDate: dueDate || todayKey(),
        priority: S.draft.priority || 'Normal',
        assignedTo: to,
        templateGroups: tplGroups,
        confidential,
        notify
      });
      closeDrawer(true);
      toast(r.mail ? (r.mail.error ? r.count + ' tasks created. Email error: ' + r.mail.error : r.mail.queued ? r.count + ' tasks created. Email queued.' : r.count + ' tasks created and emailed.') : r.count + (r.count === 1 ? ' task created.' : ' tasks created.'));
      if (r.missingKeyUsers && r.missingKeyUsers.length) {
        toast('Note: ' + r.missingKeyUsers.join(', ') + ' has not signed in yet to activate an encryption key.', true);
      }
      if (!insertLocalTasks(r.createdTasks)) {
        if (S.view === 'mine' || S.view === 'team') await loadList(S.view, { silent: true });
        else await Promise.all(['mine', 'team'].filter(k => S.data[k]).map(k => loadList(k, { silent: true })));
      }
      if (S.view === 'dashboard') { delete S.dashFilters.offset; await loadDashboard(); }
      setTimeout(() => {
        const el = $('.row[data-id="' + CSS.escape(r.taskId) + '"]');
        if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      }, 80);
    } catch (e) {
      err.textContent = e.message;
      err.hidden = false;
    }
  });
}
async function applyBulkStatus(scope, btn) {
  const ids = Array.from(S.selected[scope]), status = $('#bulk-status')?.value || '';
  if (!ids.length) return toast('Select at least one task.', true);
  if (!status) return toast('Choose a status to apply.', true);
  const reopening = status !== 'Completed' && ids.some(id => { const t = findTask(id); return t && t.Status === 'Completed'; });
  const remark = reopening ? window.prompt('A remark is required because this selection includes completed tasks. The remark will be recorded and emailed to each reopened task assignee.') : '';
  if (reopening && !String(remark || '').trim()) return;
  await busy(btn, async () => {
    try {
      const r = await api('apiBulkUpdateTaskStatus', S.token, ids, status, remark || '');
      S.selected[scope].clear();
      const applied = Array.isArray(r.updatedIds) ? r.updatedIds : ids.filter(id => !(r.failed || []).some(f => f.id === id));
      const compStamp = status === 'Completed' ? todayKey() + ' 00:00' : '';
      applied.forEach(id => patchLocalTask({ TaskID: id, Status: status, Completed: compStamp }, { skipRender: true }));
      if (S.view === 'mine' || S.view === 'team') { renderChips(S.view); renderList(S.view); }
      syncOpenTask();
      const mailErrors = (r.failed || []).filter(x => /email|mail/i.test(x.reason)).length;
      toast(r.updated + ' task(s) updated.' + ((r.failed || []).length ? ' ' + r.failed.length + ' task(s) need review.' : '') + (mailErrors ? ' ' + mailErrors + ' reopen email(s) could not be sent.' : ''), !!mailErrors);
      if (r.failed && r.failed.length) console.warn('Bulk task update items needing review:', r.failed);
    } catch (e) { if (!e.auth) toast(e.message, true); }
  });
}
async function applyBulkReassign(scope, btn) {
  const ids = Array.from(S.selected[scope]), to = $('#bulk-assignee')?.value || '';
  if (!ids.length) return toast('Select at least one task.', true);
  if (!to) return toast('Choose an employee to reassign to.', true);
  await busy(btn, async () => {
    try {
      const r = await api('apiBulkReassignTasks', S.token, ids, to);
      S.selected[scope].clear();
      if (Array.isArray(r.updatedTasks)) r.updatedTasks.forEach(t => patchLocalTask(t, { skipRender: true }));
      if (S.view === 'mine' || S.view === 'team') { renderChips(S.view); renderList(S.view); }
      syncOpenTask();
      toast(r.message || (r.updated + ' task(s) reassigned.'));
      if (r.failed && r.failed.length) console.warn('Bulk reassign skipped items:', r.failed);
    } catch (e) { if (!e.auth) toast(e.message, true); }
  });
}
async function applyBulkDelete(scope, btn) {
  const ids = Array.from(S.selected[scope]);
  if (!ids.length) return toast('Select at least one task.', true);
  if (!window.confirm(`Delete ${ids.length} selected task(s)? This cannot be undone.`)) return;
  await busy(btn, async () => {
    try {
      const r = await api('apiBulkDeleteTasks', S.token, ids);
      S.selected[scope].clear();
      const removed = Array.isArray(r.deletedIds) ? r.deletedIds : [];
      removed.forEach(id => removeLocalTask(id));
      if (S.view === 'mine' || S.view === 'team') { renderChips(S.view); renderList(S.view); }
      toast(r.message || (removed.length + ' task(s) deleted.'));
      if (r.failed && r.failed.length) console.warn('Bulk delete skipped items:', r.failed);
    } catch (e) { if (!e.auth) toast(e.message, true); }
  });
}

function sw(bind, i, k, on) { return h`<label class="sw"><input type="checkbox" data-bind="${bind}" data-i="${i}" data-k="${k}" ${on ? 'checked' : ''} aria-label="${k}"><span></span></label>`; }
function buildRoleTreeNodes(roles) {
  const byName = {}, children = {}, roots = [];
  roles.forEach(r => { if (r.Role) byName[r.Role] = r; });
  roles.forEach(r => {
    if (!r.Role) return;
    if (r.ParentRole && byName[r.ParentRole] && r.ParentRole !== r.Role) {
      (children[r.ParentRole] = children[r.ParentRole] || []).push(r);
    } else {
      roots.push(r);
    }
  });
  const out = [], seen = new Set();
  const walk = (node, depth) => {
    if (seen.has(node.Role)) return;
    seen.add(node.Role);
    out.push({ role: node, depth });
    (children[node.Role] || []).sort((a, b) => a.Role.localeCompare(b.Role)).forEach(ch => walk(ch, depth + 1));
  };
  roots.sort((a, b) => (b.IsAdmin - a.IsAdmin) || a.Role.localeCompare(b.Role)).forEach(r => walk(r, 0));
  roles.forEach(r => { if (r.Role && !seen.has(r.Role)) walk(r, 0); });
  return out;
}

          </select></td>

const XLSX_CDN = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
let xlsxPromise = null;
function ensureXlsxLib() {
  if (window.XLSX) return Promise.resolve(true);
  if (!xlsxPromise) {
    xlsxPromise = new Promise(resolve => {
      const s = document.createElement('script');
      s.src = XLSX_CDN;
      s.async = true;
      const timer = setTimeout(() => resolve(!!window.XLSX), 7000);
      s.onload = () => { clearTimeout(timer); resolve(!!window.XLSX); };
      s.onerror = () => { clearTimeout(timer); resolve(false); };
      document.head.appendChild(s);
    });
  }
  return xlsxPromise;
}

function parseCsvText(text) {
  const rows = []; let row = [], cell = '', q = false;
  const s = String(text || '').replace(/^\uFEFF/, '');
  for (let i = 0; i < s.length; i++) {
    const c = s[i], n = s[i + 1];
    if (q) {
      if (c === '"' && n === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\r' && n === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; }
      else if (c === '\n' || c === '\r') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map(h => String(h || '').trim());
  return rows.slice(1).filter(r => r.some(v => String(v || '').trim() !== '')).map(r => {
    const obj = {};
    headers.forEach((h, idx) => { if (h) obj[h] = r[idx] == null ? '' : String(r[idx]); });
    return obj;
  });
}

function toCsvText(cols, rows) {
  const escCsv = v => {
    const s = String(v == null ? '' : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols.map(escCsv).join(',')].concat(rows.map(r => cols.map(c => escCsv(r[c])).join(','))).join('\r\n');
}

async function downloadImportTemplate(kind, format) {
  const schema = IMPORT_SCHEMAS[kind];
  if (!schema) return;
  const meta = S.importMeta || { roles: S.boot?.lists?.roles || [], regions: S.boot?.lists?.regions || [] };
  const sampleRows = schema.sample(meta);

  const hasXlsx = format !== 'csv' && await ensureXlsxLib();
  if (hasXlsx && window.XLSX) {
    const wb = XLSX.utils.book_new();
    const aoa = [schema.cols].concat(sampleRows.map(r => schema.cols.map(c => r[c] == null ? '' : r[c])));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = schema.cols.map(c => ({ wch: Math.max(16, c === 'Description' || c === 'Title' || c === 'Email' ? 32 : 18) }));
    XLSX.utils.book_append_sheet(wb, ws, 'Template');

    const refRows = [['Field Rules'], ...schema.notes.map(n => [n]), [], ['Active Roles', 'App Roles', 'Active Regions', 'State (Region)', 'Division (Region > State)']];
    const appRoles = meta.appRoles || ['User', 'Division Admin', 'State Admin', 'Region Admin'];
    const statesRef = (meta.states || []).map(s => `${s.State} (${s.Region})`);
    const divsRef = (meta.divisions || []).map(d => `${d.Division} (${d.Region} > ${d.State})`);
    const maxLen = Math.max((meta.roles || []).length, appRoles.length, (meta.regions || []).length, statesRef.length, divsRef.length);
    for (let i = 0; i < maxLen; i++) {
      refRows.push([(meta.roles || [])[i] || '', appRoles[i] || '', (meta.regions || [])[i] || '', statesRef[i] || '', divsRef[i] || '']);
    }
    const wsRef = XLSX.utils.aoa_to_sheet(refRows);
    wsRef['!cols'] = [{ wch: 30 }, { wch: 18 }, { wch: 18 }, { wch: 28 }, { wch: 38 }];
    XLSX.utils.book_append_sheet(wb, wsRef, 'Reference');
    XLSX.writeFile(wb, schema.file + '.xlsx');
    toast('Excel template downloaded (.xlsx).');
    return;
  }

  const blob = new Blob([toCsvText(schema.cols, sampleRows)], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = schema.file + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast(format === 'csv' ? 'CSV template downloaded.' : 'Excel library unavailable offline; downloaded CSV template instead.');
}

function normalizeImportRows(kind, rawObjects) {
  const schema = IMPORT_SCHEMAS[kind];
  return rawObjects.map((raw, idx) => {
    const norm = { _row: idx + 2 };
    schema.cols.forEach(c => { norm[c] = ''; });
    Object.keys(raw || {}).forEach(k => {
      const cleanKey = String(k || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const target = schema.aliases[cleanKey];
      if (target) norm[target] = String(raw[k] == null ? '' : raw[k]).trim();
    });
    return norm;
  }).filter(r => schema.cols.some(c => r[c] !== ''));
}

function validateImportPreview(kind, rows) {
  const meta = S.importMeta || { roles: [], regions: [], states: [], divisions: [], appRoles: ['User', 'Division Admin', 'State Admin', 'Region Admin'], existingCodes: [], existingEmails: [], existingTemplateTitles: [], minPasswordLength: 6 };
  const activeRoles = new Set(meta.roles || []);
  const activeRegions = new Set(meta.regions || []);
  const activeStates = meta.states || [];
  const activeDivs = meta.divisions || [];
  const appRoleList = meta.appRoles || ['User', 'Division Admin', 'State Admin', 'Region Admin'];
  const existingCodes = new Set((meta.existingCodes || []).map(x => String(x).toUpperCase()));
  const existingEmails = new Set((meta.existingEmails || []).map(x => String(x).toLowerCase()));
  const existingTitles = new Set((meta.existingTemplateTitles || []).map(x => String(x).toLowerCase()));
  const seenBatch = new Set();
  const seenEmails = new Set();

  // For people, track codes inside this batch so subordinate rows referencing a batch Nazim pass preview validation
  const batchCodes = new Set();
  if (kind === 'people') {
    rows.forEach(r => { const c = (r.EmpCode || '').toUpperCase(); if (c && !existingCodes.has(c)) batchCodes.add(c); });
  }

  return rows.map(r => {
    if (kind === 'locations') {
      if (!r.Region) return { row: r, status: 'ERROR', msg: 'Region is required.' };
      if (r.Division && !r.State) return { row: r, status: 'ERROR', msg: 'State is required when Division is specified.' };
      const key = [r.Region, r.State, r.Division].filter(Boolean).join('|').toLowerCase();
      if (seenBatch.has(key)) return { row: r, status: 'SKIP', msg: 'Duplicate row in file.' };
      seenBatch.add(key);
      return { row: r, status: 'READY', msg: 'Ready to import' };
    }

    if (kind === 'people') {
      const code = (r.EmpCode || '').toUpperCase();
      r.EmpCode = code;
      r.Nazim = (r.Nazim || '').toUpperCase();
      const matchedAppRole = appRoleList.find(x => x.toLowerCase() === String(r.AppRole || 'User').toLowerCase());
      if (!matchedAppRole) return { row: r, status: 'ERROR', msg: `Invalid AppRole "${r.AppRole}".` };
      r.AppRole = matchedAppRole;
      if (!code) return { row: r, status: 'ERROR', msg: 'EmpCode is required.' };
      if (!/^[A-Za-z0-9._-]{1,30}$/.test(code)) return { row: r, status: 'ERROR', msg: 'EmpCode contains invalid characters.' };
      if (existingCodes.has(code)) return { row: r, status: 'SKIP', msg: 'Already exists in directory.' };
      if (seenBatch.has(code)) return { row: r, status: 'ERROR', msg: 'Duplicate EmpCode in file.' };
      seenBatch.add(code);
      if (!r.EmpName) return { row: r, status: 'ERROR', msg: 'EmpName is required.' };
      if (!activeRoles.has(r.Role)) return { row: r, status: 'ERROR', msg: `Role "${r.Role || '(blank)'}" is unknown or off.` };
      if (!activeRegions.has(r.Region)) return { row: r, status: 'ERROR', msg: `Region "${r.Region || '(blank)'}" is unknown or off.` };
      const stInReg = activeStates.filter(s => s.Region === r.Region);
      if ((r.AppRole === 'State Admin' || r.AppRole === 'Division Admin') && !r.State) return { row: r, status: 'ERROR', msg: `State is required for ${r.AppRole}.` };
      if (r.State && stInReg.length && !stInReg.some(s => s.State === r.State)) return { row: r, status: 'ERROR', msg: `State "${r.State}" is not under "${r.Region}".` };
      const dvInSt = activeDivs.filter(d => d.Region === r.Region && d.State === r.State);
      if (r.AppRole === 'Division Admin' && !r.Division) return { row: r, status: 'ERROR', msg: 'Division is required for Division Admin.' };
      if (r.Division && dvInSt.length && !dvInSt.some(d => d.Division === r.Division)) return { row: r, status: 'ERROR', msg: `Division "${r.Division}" is not under "${r.State}".` };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.Email || '')) return { row: r, status: 'ERROR', msg: 'Valid Email is required.' };
      const lowEmail = r.Email.toLowerCase();
      if (existingEmails.has(lowEmail) || seenEmails.has(lowEmail)) return { row: r, status: 'ERROR', msg: 'Email already used.' };
      seenEmails.add(lowEmail);
      if (r.Nazim === code) return { row: r, status: 'ERROR', msg: 'Cannot be own Nazim.' };
      if (r.Nazim && !existingCodes.has(r.Nazim) && !batchCodes.has(r.Nazim)) return { row: r, status: 'ERROR', msg: `Nazim "${r.Nazim}" not found.` };
      const minPw = Math.min(Number(meta.minPasswordLength) || 8, 6);
      if (!r.Password || r.Password.length < minPw) return { row: r, status: 'ERROR', msg: `Password min ${minPw} chars.` };
      if (r.Password.toLowerCase() === code.toLowerCase()) return { row: r, status: 'ERROR', msg: 'Password cannot equal EmpCode.' };
      return { row: r, status: 'READY', msg: 'Ready to create' };
    }

    if (kind === 'roles') {
      const name = r.Role || '';
      if (!name) return { row: r, status: 'ERROR', msg: 'Role name is required.' };
      const low = name.toLowerCase();
      if (new Set((meta.allRoleNames || meta.roles || []).map(x => x.toLowerCase())).has(low)) return { row: r, status: 'SKIP', msg: 'Role already exists.' };
      if (seenBatch.has(low)) return { row: r, status: 'ERROR', msg: 'Duplicate Role in file.' };
      seenBatch.add(low);
      return { row: r, status: 'READY', msg: 'Ready to create' };
    }

    /* templates */
    const title = r.Title || '';
    if (!title) return { row: r, status: 'ERROR', msg: 'Title is required.' };
    const lowT = title.toLowerCase();
    if (existingTitles.has(lowT)) return { row: r, status: 'SKIP', msg: 'Template title already exists.' };
    if (seenBatch.has(lowT)) return { row: r, status: 'ERROR', msg: 'Duplicate Title in file.' };
    seenBatch.add(lowT);
    const isAll = /^(y|yes|true|1)$/i.test(r.AllDesignations || '');
    const roleList = String(r.Roles || '').split(/[,;|]/).map(s => s.trim()).filter(Boolean);
    const badRoles = roleList.filter(x => !activeRoles.has(x));
    if (!isAll && badRoles.length) return { row: r, status: 'ERROR', msg: 'Unknown role(s): ' + badRoles.join(', ') };
    if (!isAll && !roleList.length && !/^(n|no|false|0)$/i.test(r.Active || 'Y')) return { row: r, status: 'ERROR', msg: 'Specify Roles or set AllDesignations=Y.' };
    return { row: r, status: 'READY', msg: 'Ready to create' };
  });
}

async function handleImportFile(file) {
  if (!file) return;
  const kind = S.importType || 'people';
  S.importFileName = file.name;
  S.importResult = null;
  try {
    let rawObjects = [];
    if (/\.csv$/i.test(file.name)) {
      const txt = await file.text();
      rawObjects = parseCsvText(txt);
    } else {
      const ok = await ensureXlsxLib();
      if (!ok || !window.XLSX) {
        return toast('Excel parser could not load (check internet connection) or save the file as .csv and upload.', true);
      }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheetName = wb.SheetNames[0];
      if (!sheetName) return toast('No worksheet found in this Excel file.', true);
      rawObjects = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
    }
    const normalized = normalizeImportRows(kind, rawObjects);
    if (!normalized.length) {
      S.importPreview = null;
      paintAdminImport();
      return toast('No data rows found. Make sure column headers match the downloaded template.', true);
    }
    const maxRows = kind === 'people' ? 100 : kind === 'locations' ? 300 : 200;
    if (normalized.length > maxRows) {
      toast(`Showing first ${maxRows} rows (maximum ${maxRows} rows per upload).`, true);
    }
    S.importPreview = validateImportPreview(kind, normalized.slice(0, maxRows));
    paintAdminImport();
  } catch (err) {
    toast('Could not read file: ' + (err.message || err), true);
  }
}

async function runMasterImport(btn) {
  const kind = S.importType || 'people';
  const readyRows = (S.importPreview || []).filter(x => x.status === 'READY').map(x => x.row);
  if (!readyRows.length) return toast('No valid rows ready to import.', true);
  const apiName = kind === 'people' ? 'apiImportPeople' : kind === 'locations' ? 'apiImportLocations' : kind === 'roles' ? 'apiImportRoles' : 'apiImportTemplates';
  await busy(btn, async () => {
    try {
      const r = await api(apiName, S.token, readyRows);
      S.importResult = r;
      S.importPreview = null;
      S.importMeta = await api('apiImportMeta', S.token).catch(() => S.importMeta);
      toast(`Import complete: ${r.created} created, ${r.skipped} skipped, ${r.failed} failed.`);
      if (inAdmin('import')) paintAdminImport();
    } catch (e) {
      if (!e.auth) toast(e.message, true);
    }
  });
}

async function adminImport() {
  S.importMeta = await api('apiImportMeta', S.token);
  if (!inAdmin('import')) return;
  ensureXlsxLib();
  paintAdminImport();
}

function paintAdminImport() {
  const kind = S.importType || 'people', schema = IMPORT_SCHEMAS[kind];
  const prev = S.importPreview, res = S.importResult;
  const readyCnt = prev ? prev.filter(x => x.status === 'READY').length : 0;
  const skipCnt = prev ? prev.filter(x => x.status === 'SKIP').length : 0;
  const errCnt = prev ? prev.filter(x => x.status === 'ERROR').length : 0;

  mount($('#adm'), h`<div style="display:grid;gap:16px">
    <section class="panel" style="margin:0">
      <h3>Master Excel Import</h3>
      <p class="muted" style="margin-bottom:14px">Download an Excel template, fill in new master records, and upload it to create records in bulk. Existing records are safely skipped.</p>
      <div class="imp-types" role="group" aria-label="Import type">
        ${Object.keys(IMPORT_SCHEMAS).map(k => h`<button type="button" class="imp-type" data-act="imptype" data-k="${k}" aria-pressed="${kind === k}">
          <b>${IMPORT_SCHEMAS[k].title}</b>
          <small>${IMPORT_SCHEMAS[k].sub}</small>
        </button>`)}
      </div>

      <div class="adm-grid">
        <div class="panel" style="margin:0;background:var(--paper)">
          <h3>1. Download Template</h3>
          <p class="muted" style="font-size:.86rem">Columns: <code>${schema.cols.join(', ')}</code></p>
          <ul style="margin:8px 0 14px 18px;padding:0;font-size:.83rem;color:var(--muted);display:grid;gap:4px">
            ${schema.notes.map(n => h`<li>${n}</li>`)}
          </ul>
          <div class="actions">
            <button type="button" class="btn primary" data-act="dltemplate" data-fmt="xlsx" data-busy="Preparing">Download Excel Template (.xlsx)</button>
            <button type="button" class="btn sm" data-act="dltemplate" data-fmt="csv">Download CSV</button>
          </div>
        </div>

        <div class="panel" style="margin:0;background:var(--paper)">
          <h3>2. Upload Filled File</h3>
          <input id="imp-file" type="file" accept=".xlsx,.xls,.csv" hidden>
          <div class="imp-drop" id="imp-drop" data-act="pickimpfile" tabindex="0" role="button" aria-label="Choose Excel or CSV file">
            <b style="font-size:1rem">Drop Excel (.xlsx / .xls) or CSV file here</b>
            <small class="muted">${S.importFileName ? 'Last file: ' + S.importFileName : 'Or click to browse from your computer'}</small>
            <span class="btn sm" style="margin-top:4px">Choose File</span>
          </div>
        </div>
      </div>
    </section>

    ${prev ? h`<section class="panel" style="margin:0">
      <div class="actions" style="justify-content:space-between;align-items:center;margin-bottom:12px">
        <div>
          <h3 style="margin:0">Preview: ${S.importFileName} (${prev.length} rows)</h3>
          <small class="muted">
            <b style="color:var(--ok)">${readyCnt} ready</b> ·
            <b style="color:var(--warn)">${skipCnt} existing (will skip)</b> ·
            <b style="color:var(--bad)">${errCnt} errors</b>
          </small>
        </div>
        <div class="actions">
          <button type="button" class="btn" data-act="clearimp">Clear</button>
          <button type="button" class="btn primary" data-act="runimport" data-busy="Importing" ${readyCnt ? '' : 'disabled'}>Import ${readyCnt} Valid Record${readyCnt === 1 ? '' : 's'}</button>
        </div>
      </div>
      <div class="scroll-x" style="max-height:420px;overflow-y:auto">
        <table class="tbl">
          <thead><tr><th>Row</th><th>Status</th>${schema.cols.map(c => h`<th>${c}</th>`)}<th>Validation</th></tr></thead>
          <tbody>
            ${prev.map(item => h`<tr>
              <td class="num">${item.row._row}</td>
              <td><span class="badge ${item.status === 'READY' ? 'b-PASS' : item.status === 'SKIP' ? 'b-WARN' : 'b-FAIL'}">${item.status}</span></td>
              ${schema.cols.map(c => h`<td>${c === 'Password' ? (item.row[c] ? '•••••••• (' + item.row[c].length + ')' : '—') : (item.row[c] || '—')}</td>`)}
              <td><small style="color:${item.status === 'ERROR' ? 'var(--bad)' : item.status === 'SKIP' ? 'var(--warn)' : 'var(--ok)'}">${item.msg}</small></td>
            </tr>`)}
          </tbody>
        </table>
      </div>
    </section>` : ''}

    ${res ? h`<section class="panel" style="margin:0">
      <div class="notice ${res.failed ? 'warn' : 'ok'}" style="margin-bottom:12px">
        <b>Import Complete:</b> ${res.created} created · ${res.skipped} skipped · ${res.failed} failed
      </div>
      <div class="scroll-x" style="max-height:360px;overflow-y:auto">
        <table class="tbl">
          <thead><tr><th>Row</th><th>Record</th><th>Result</th><th>Details</th></tr></thead>
          <tbody>
            ${(res.results || []).map(x => h`<tr>
              <td class="num">${x.row}</td>
              <td><b>${x.key}</b></td>
              <td><span class="badge ${x.status === 'CREATED' ? 'b-PASS' : x.status === 'SKIPPED' ? 'b-WARN' : 'b-FAIL'}">${x.status}</span></td>
              <td>${x.message}</td>
            </tr>`)}
          </tbody>
        </table>
      </div>
    </section>` : ''}
  </div>`);

  const drop = $('#imp-drop');
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('drag');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) handleImportFile(e.dataTransfer.files[0]);
    });
  }
}

let CMD_ITEMS = [];
let CMD_IDX = 0;
function closeCommandPalette() {
  const root = $('#cmd-root');
  if (root) root.innerHTML = '';
  CMD_ITEMS = [];
  CMD_IDX = 0;
}
function buildCommandItems(query) {
  if (!S.token || !S.boot) return [];
  const q = String(query || '').trim().toLowerCase();
  const u = S.boot.user || {}, mgr = u.isNazim || u.isAdmin, teamMgr = !!u.hasTeam || mgr;
  const items = [];
  const add = (sec, label, meta, run) => {
    if (!q || (sec + ' ' + label + ' ' + meta).toLowerCase().includes(q)) items.push({ sec, label, meta, run });
  };
  add('Actions', '+ Create New Task', 'Shortcut: N', () => newTask());
  add('Views', 'My tasks', 'Personal workspace', () => showView('mine'));
  if (teamMgr) add('Views', 'Dashboard Overview', 'Team KPIs & charts', () => { S.dashTab = 'overview'; showView('dashboard'); });
  if (teamMgr) add('Views', 'Dashboard Calendar & Heatmap', '14-day congestion forecast', () => { S.dashTab = 'calendar'; showView('dashboard'); });
  if (teamMgr) add('Views', 'Team Tasks', 'Tasks assigned to your team', () => showView('team'));
  if (mgr) add('Views', 'Email Digests & Logs', 'Send or review reminders', () => showView('mail'));
  if (u.isAdmin) add('Views', 'Admin Panel', 'People, roles, locations & settings', () => showView('admin'));
  add('Actions', 'Toggle Dark / Light Theme', 'Switch appearance', () => {
    const cur = store.get('tm.theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    store.set('tm.theme', next); applyPrefs(); toast('Theme: ' + next);
  });
  add('Actions', 'Keyboard Shortcuts', 'Shortcut: ?', () => openShortcutsModal());

  // Loaded tasks (0 extra reads)
  const seenIds = new Set();
  const taskPools = [
    ...(S.data.mine && S.data.mine.tasks || []),
    ...(S.data.team && S.data.team.tasks || []),
    ...(S.dashboard && S.dashboard.drilldown && S.dashboard.drilldown.tasks || []),
    ...(S.dashboard && S.dashboard.calendarTasks || [])
  ];
  let taskMatches = 0;
  for (const t of taskPools) {
    if (!t || !t.TaskID || seenIds.has(t.TaskID)) continue;
    seenIds.add(t.TaskID);
    const title = t.Title || t.TaskID;
    const meta = [t.Status, t.Priority && t.Priority !== 'Normal' ? t.Priority : '', t.AssignedToName].filter(Boolean).join(' · ');
    if (!q && taskMatches >= 5) continue;
    if (!q || (title + ' ' + meta + ' ' + t.TaskID).toLowerCase().includes(q)) {
      items.push({ sec: 'Tasks', label: title, meta, run: () => openTask(t.TaskID) });
      taskMatches++;
      if (taskMatches >= 8) break;
    }
  }

  // Team members (for Nazims / Admins)
  if (teamMgr && Array.isArray(S.boot.people)) {
    let empMatches = 0;
    for (const p of S.boot.people) {
      const meta = [p.c, p.r, p.g].filter(Boolean).join(' · ');
      if (!q && empMatches >= 4) break;
      if (!q || (p.n + ' ' + meta).toLowerCase().includes(q)) {
        items.push({
          sec: 'People',
          label: p.n,
          meta,
          run: () => { S.dashFilters.employee = p.c; delete S.dashFilters.offset; S.dashTab = 'tasks'; showView('dashboard'); }
        });
        empMatches++;
        if (empMatches >= 6) break;
      }
    }
  }
  return items;
}
function paintCommandList(query) {
  CMD_ITEMS = buildCommandItems(query);
  if (CMD_IDX >= CMD_ITEMS.length) CMD_IDX = Math.max(0, CMD_ITEMS.length - 1);
  const box = $('#cmd-list'); if (!box) return;
  if (!CMD_ITEMS.length) {
    mount(box, h`<div class="empty" style="padding:20px">No matching views, tasks, or people.</div>`);
    return;
  }
  let lastSec = '';
  const out = [];
  CMD_ITEMS.forEach((it, i) => {
    if (it.sec !== lastSec) { lastSec = it.sec; out.push(h`<div class="cmd-sec">${it.sec}</div>`); }
    out.push(h`<button type="button" class="cmd-item" data-act="cmdpick" data-i="${i}" aria-selected="${i === CMD_IDX}">
      <span><b>${it.label}</b></span>
      <small>${it.meta}</small>
    </button>`);
  });
  mount(box, h`${out}`);
  const sel = $('.cmd-item[aria-selected="true"]', box);
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}
function openCommandPalette() {
  if (!S.token || !S.boot || isAckLocked()) return;
  const root = $('#cmd-root'); if (!root) return;
  CMD_IDX = 0;
  mount(root, h`<div class="cmd-backdrop" data-act="closecmd" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmd-box">
      <div class="cmd-in-wrap">
        <span style="color:var(--muted);font-weight:700">⌘</span>
        <input id="cmd-in" type="search" placeholder="Jump to view, task, or team member…" autocomplete="off" maxlength="100">
        <span class="kbd-hint">Esc</span>
      </div>
      <div id="cmd-list" class="cmd-list"></div>
    </div>
  </div>`);
  paintCommandList('');
  setTimeout(() => { const inp = $('#cmd-in'); if (inp) inp.focus(); }, 20);
}

  repair: el => busy(el, async () => { try { const r = await api('apiRepair', S.token); toast(r.repaired.length ? 'Repaired: ' + r.repaired.join('; ') : 'Nothing needed fixing.'); } catch (e) { if (!e.auth) toast(e.message, true); } }),
  demo: el => busy(el, async () => { try { const r = await api('apiDemoData', S.token, el.dataset.m); toast(el.dataset.m === 'make' ? 'Demo data created. Password: ' + r.password : 'Demo data removed.'); } catch (e) { if (!e.auth) toast(e.message, true); } }),
  shortcuts: () => openShortcutsModal(),
  sendpwreset: el => {
    const code = el.dataset.c;
    busy(el, async () => {
      try {
        const r = await api('apiSendPasswordReset', S.token, code);
        toast(r.message || 'Password reset email sent.');
      } catch (e) { if (!e.auth) toast(e.message, true); }
    });
  }
};
const findSubmitBtn = f => f._btn || $(`button[data-f="${f.id}"]`) || $('button.primary', f) || $('#dfoot button.primary');
const FORMS = {
  quickadd: f => quickAdd(f), login: f => doLogin(f), savesettings: f => saveSettings(f), reopentask: f => reopenTask(f, findSubmitBtn(f)),
  changepw: f => changePassword(f),
  unlockvault: f => busy($('button', f), async () => {
    try {
      await api('apiUnlockVault', S.token, $('#uv-pw').value);
      if (S.boot && S.boot.user) S.boot.user.vaultUnlocked = true;
      toast('Encryption vault unlocked for this device.');
      await Promise.all(['mine', 'team'].filter(k => S.data[k]).map(k => loadList(k, { silent: true })));
      if (S.view === 'dashboard') loadDashboard(true);
      if (S.openId) openTask(S.openId);
    } catch (e) { if (!e.auth) toast(e.message, true); }
  }),
  savetask: f => { if (!$('.pval', f).value) { const e = $('#e-err'); e.textContent = 'Choose a person from the list.'; e.hidden = false; return; } saveTask(f, findSubmitBtn(f)); },
  createtask: f => createTask(f, findSubmitBtn(f)),
  saveperson: f => savePerson(f, findSubmitBtn(f)),
  savetemplate: f => saveTemplate(f, findSubmitBtn(f)),
  addregion: f => busy($('button', f), async () => { try { await api('apiSaveLocation', S.token, 'region', { Region: $('#loc-new-reg').value, Active: true }); toast('Region added.'); adminLocations(); } catch (e) { if (!e.auth) toast(e.message, true); } }),
  addstate: f => busy($('button', f), async () => {
    const pick = $('#loc-st-pick') ? $('#loc-st-pick').value : '';
    const stateName = (pick === '__CUSTOM__' ? ($('#loc-new-st') ? $('#loc-new-st').value : '') : pick).trim();
    if (!stateName) return toast('Choose or enter a State name.', true);
    try { await api('apiSaveLocation', S.token, 'state', { Region: $('#loc-st-reg').value, State: stateName, Active: true }); toast('State added.'); adminLocations(); } catch (e) { if (!e.auth) toast(e.message, true); }
  }),
  adddivision: f => busy($('button', f), async () => { try { await api('apiSaveLocation', S.token, 'division', { Region: $('#loc-dv-reg').value, State: $('#loc-dv-st').value, Division: $('#loc-new-dv').value, Active: true }); toast('Division added.'); adminLocations(); } catch (e) { if (!e.auth) toast(e.message, true); } })
};
document.addEventListener('click', e => {
  if (DD_OPEN && !e.target.closest('#tm-dd-portal') && !e.target.closest('.tm-dd')) closeCustomSelect();
  $$('.plist').forEach(u => { if (!u.parentElement.contains(e.target)) u.hidden = true; });
  if (e.target === $('#scrim')) return closeDrawer();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
window.addEventListener('resize', () => { if (DD_OPEN) closeCustomSelect(); });
document.addEventListener('scroll', e => { if (DD_OPEN && e.target !== ddPortal()) closeCustomSelect(); }, true);
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f, e); });
document.addEventListener('keydown', e => {
  if (DD_OPEN) {
    const opts = DD_OPEN.opts || [];
    if (e.key === 'Escape') { e.preventDefault(); const b = DD_OPEN.btn; closeCustomSelect(); if (b) b.focus(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!opts.length) return;
      const dir = e.key === 'ArrowDown' ? 1 : -1;
      let next = DD_OPEN.hiIdx;
      for (let step = 0; step < opts.length; step++) {
        next = (next + dir + opts.length) % opts.length;
        if (!opts[next].disabled) { DD_OPEN.hiIdx = next; break; }
      }
      paintCustomSelectMenu();
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const o = opts[DD_OPEN.hiIdx];
      if (o && !o.disabled) {
        const sel = DD_OPEN.sel, b = DD_OPEN.btn;
        sel.selectedIndex = DD_OPEN.hiIdx;
        sel.value = o.value;
        syncCustomSelect(sel);
        closeCustomSelect();
        sel.dispatchEvent(new Event('change', { bubbles: true }));
        if (b) b.focus();
      }
      return;
    }
  }
  if (isAckLocked()) { if (e.key === 'Escape') e.preventDefault(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if ($('#cmd-in')) closeCommandPalette(); else openCommandPalette();
    return;
  }
  if ($('#cmd-in')) {
    if (e.key === 'Escape') { e.preventDefault(); closeCommandPalette(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); if (CMD_ITEMS.length) { CMD_IDX = (CMD_IDX + 1) % CMD_ITEMS.length; paintCommandList($('#cmd-in').value); } return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); if (CMD_ITEMS.length) { CMD_IDX = (CMD_IDX - 1 + CMD_ITEMS.length) % CMD_ITEMS.length; paintCommandList($('#cmd-in').value); } return; }
    if (e.key === 'Enter') { e.preventDefault(); const it = CMD_ITEMS[CMD_IDX]; closeCommandPalette(); if (it && it.run) it.run(); return; }
    return;
  }
  const isInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName);
  const isDrawerOpen = $('#drawer') && $('#drawer').classList.contains('open');

  if (e.key === 'Escape') {
    if (!$('.plist').every(u => u.hidden)) { $('.plist').forEach(u => { u.hidden = true; }); return; }
    if (isDrawerOpen) { closeDrawer(); return; }
    if (S.selected && S.selected[S.view] && S.selected[S.view].size) { S.selected[S.view].clear(); renderList(S.view); return; }
    if (isInput) { document.activeElement.blur(); return; }
    return;
  }
  if ((e.key === 'n' || e.key === 'N') && !isInput && !isDrawerOpen && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (S.token && S.boot) { e.preventDefault(); newTask(); return; }
  }
  if (e.key === '/' && !isInput && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const sInp = $('input[data-k="search"]') || $('#dashsearch') || $('input[type="search"]') || $('#qa-t');
    if (sInp && sInp.offsetParent !== null) {
      e.preventDefault();
      sInp.focus();
      sInp.select();
      return;
    }
  }
  if (e.key === '?' && !isInput && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    openShortcutsModal();
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.row,.tbl tr.click,.cal-cell')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'n-taskTitle') { e.preventDefault(); addTaskTitle(); }
});
const applyFilter = debounce((scope) => loadList(scope, { silent: true }), 300);
const applyDraftPreview = debounce(() => paintDraftPreview(), 150);
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'cmd-in') { CMD_IDX = 0; paintCommandList(el.value); return; }
  if (el.dataset.in === 'filter') { const f = S.filters[S.view], v = el.value.trim(); if (v) f[el.dataset.k] = v; else delete f[el.dataset.k]; applyFilter(S.view); }
  else if (el.dataset.in === 'pick') { const box = el.closest('.picker'); $('.pval', box).value = ''; pickerShow(box); }
  else if (el.dataset.in === 'peopleq') { S.admin.q = el.value; paintPeople(); }
  else if (el.dataset.in === 'mailmanagerq') { S.mailManagerSearch = el.value; paintMailManagers(); }
  else if (el.dataset.in === 'dashsearch') { S.dashSearch = el.value; const b = $('#dashboard-content'); if (b && S.dashboard && S.dashTab === 'team') paintDashboardTeam(b, S.dashboard); }
  else if (el.dataset.in === 'dashtasksearch') { S.dashTaskQuery = el.value; const b = $('#dashboard-content'); if (b && S.dashboard && S.dashTab === 'tasks') paintDashboardTasks(b, S.dashboard); }
  else if (el.id === 'n-people-search') paintAssignees();
  else if (el.id === 'n-tpl-search') paintTemplates();
  else if (el.id === 'n-taskTitle') applyDraftPreview();
  else if (el.id === 'n-due') applyDraftPreview();
  else if (el.dataset.bind) bindChange(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'imp-file' && el.files && el.files[0]) { handleImportFile(el.files[0]); return; }
  if (el.dataset.ch === 'peregion') {
    const reg = el.value, addBox = $('#pe-add-reg-box');
    if (addBox) addBox.hidden = reg !== '__NEW__';
    if (reg === '__NEW__') { $('#pe-new-reg')?.focus(); return; }
    const stEl = $('#pe-state'), dvEl = $('#pe-div');
    if (stEl) stEl.innerHTML = personStateOptionsHtml(reg, '');
    if (dvEl) dvEl.innerHTML = personDivisionOptionsHtml(reg, '', '');
    if ($('#pe-add-st-box')) $('#pe-add-st-box').hidden = true;
    if ($('#pe-add-dv-box')) $('#pe-add-dv-box').hidden = true;
    return;
  }
  if (el.dataset.ch === 'pestate') {
    const reg = $('#pe-region') ? $('#pe-region').value : '', st = el.value, addBox = $('#pe-add-st-box');
    if (addBox) addBox.hidden = st !== '__NEW__';
    if (st === '__NEW__') { $('#pe-new-st-sel')?.focus(); return; }
    const dvEl = $('#pe-div');
    if (dvEl) dvEl.innerHTML = personDivisionOptionsHtml(reg, st, '');
    if ($('#pe-add-dv-box')) $('#pe-add-dv-box').hidden = true;
    return;
  }
  if (el.dataset.ch === 'penewstsel') {
    const txt = $('#pe-new-st-txt');
    if (txt) { txt.hidden = el.value !== '__CUSTOM__'; if (el.value === '__CUSTOM__') txt.focus(); }
    return;
  }
  if (el.dataset.ch === 'pediv') {
    const addBox = $('#pe-add-dv-box');
    if (addBox) addBox.hidden = el.value !== '__NEW__';
    if (el.value === '__NEW__') $('#pe-new-dv')?.focus();
    return;
  }
  if (el.dataset.ch === 'locstpick') {
    const txt = $('#loc-new-st');
    if (txt) { txt.hidden = el.value !== '__CUSTOM__'; txt.required = el.value === '__CUSTOM__'; if (el.value === '__CUSTOM__') txt.focus(); }
    return;
  }
  if (el.dataset.ch === 'locfreg') { S.admin.locReg = el.value; S.admin.locState = ''; paintLocations(); return; }
  if (el.dataset.ch === 'locfstate') { S.admin.locState = el.value; paintLocations(); return; }
  if (el.dataset.ch === 'locdvreg') {
    const reg = el.value, stSel = $('#loc-dv-st');
    if (stSel) {
      const sts = ((S.admin.loc && S.admin.loc.states) || []).filter(s => s.Active && (!reg || s.Region === reg)).map(s => s.State);
      stSel.innerHTML = '<option value="">Choose State…</option>' + sts.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    }
    return;
  }
  if (el.dataset.ch === 'locactive') {
    const kind = el.dataset.kind, on = el.checked;
    api('apiSaveLocation', S.token, kind, { id: el.dataset.id, Region: el.dataset.reg || el.dataset.name, State: el.dataset.st || el.dataset.name, Division: el.dataset.name, Active: on })
      .then(() => { toast('Updated.'); adminLocations(); })
      .catch(err => { el.checked = !on; if (!err.auth) toast(err.message, true); });
    return;
  }
  if (el.dataset.ch === 'filter') {
    const f = S.filters[S.view], k = el.dataset.k;
    if (el.value) f[k] = el.value; else delete f[k];
    if (k === 'region') {
      const stOpts = teamStateOptions(el.value);
      if (f.state && !stOpts.includes(f.state)) delete f.state;
      const dvOpts = teamDivisionOptions(el.value, f.state || '');
      if (f.division && !dvOpts.includes(f.division)) delete f.division;
      const stEl = $('#flt-state'), dvEl = $('#flt-division');
      if (stEl) stEl.innerHTML = '<option value="">All states</option>' + stOpts.map(s => `<option value="${esc(s)}" ${f.state === s ? 'selected' : ''}>${esc(s)}</option>`).join('');
      if (dvEl) dvEl.innerHTML = '<option value="">All divisions</option>' + dvOpts.map(d => `<option value="${esc(d)}" ${f.division === d ? 'selected' : ''}>${esc(d)}</option>`).join('');
    } else if (k === 'state') {
      const dvOpts = teamDivisionOptions(f.region || '', el.value);
      if (f.division && !dvOpts.includes(f.division)) delete f.division;
      const dvEl = $('#flt-division');
      if (dvEl) dvEl.innerHTML = '<option value="">All divisions</option>' + dvOpts.map(d => `<option value="${esc(d)}" ${f.division === d ? 'selected' : ''}>${esc(d)}</option>`).join('');
    }
    loadList(S.view, { silent: true });
  }
  else if (el.dataset.ch === 'dashfilter') {
    const k = el.dataset.k;
    if (el.value) S.dashFilters[k] = el.value; else delete S.dashFilters[k];
    if (k === 'region') { delete S.dashFilters.state; delete S.dashFilters.location; }
    else if (k === 'state') { delete S.dashFilters.location; }
    delete S.dashFilters.offset;
    loadDashboard();
  }
  else if (el.id === 'n-due') paintDraftPreview();
  else if (el.dataset.ch === 'assignee') {
    if (el.checked) S.draft.assignees.add(el.dataset.c);
    else S.draft.assignees.delete(el.dataset.c);
    paintAssignees();
    paintDraftPreview();
  }
  else if (el.dataset.ch === 'tpl') { const r = el.dataset.role, set = S.draft.tpl[r] || (S.draft.tpl[r] = new Set()); if (el.checked) set.add(el.dataset.id); else { set.delete(el.dataset.id); if (!set.size) delete S.draft.tpl[r]; } paintTemplates(); }
  else if (el.dataset.ch === 'tplall') $$('input[name="tp-role"]').forEach(x => { x.disabled = el.checked; });
  else if (el.dataset.ch === 'tplactive') {
    const id = el.dataset.id, on = el.checked;
    api('apiSetTemplateActive', S.token, id, on).then(() => { const t = (S.admin.tpls || []).find(x => x.id === id); if (t) t.active = on; toast(on ? 'Template is on.' : 'Template is off.'); })
      .catch(e => { el.checked = !on; if (!e.auth) toast(e.message, true); });
  }
  else if (el.dataset.bind) bindChange(el);
});
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('pin')) pickerShow(e.target.closest('.picker')); });
let KB_DRAG_ID = '';
document.addEventListener('dragstart', e => {
  const card = e.target.closest && e.target.closest('.kb-card[draggable="true"]');
  if (!card) return;
  KB_DRAG_ID = card.dataset.id || '';
  if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', KB_DRAG_ID); }
});
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.kb-col');
  if (!col || !KB_DRAG_ID) return;
  e.preventDefault();
  col.classList.add('is-drop');
});
document.addEventListener('dragleave', e => {
  const col = e.target.closest && e.target.closest('.kb-col');
  if (col && (!e.relatedTarget || !col.contains(e.relatedTarget))) col.classList.remove('is-drop');
});
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.kb-col');
  $$('.kb-col.is-drop').forEach(x => x.classList.remove('is-drop'));
  if (!col || !KB_DRAG_ID) return;
  e.preventDefault();
  const id = KB_DRAG_ID; KB_DRAG_ID = '';
  const targetStatus = col.dataset.col;
  const t = findTask(id);
  if (!t || !targetStatus || t.Status === targetStatus || !t.CanUpdate) return;
  if (t.NeedsAck) return confirmAckTasks([t.TaskID]);
  const lockPending = !t.SelfAssigned && !t.CanManage && !!t.ReceivedAt;
  if (lockPending && targetStatus === 'Pending') return toast('Confirmed Nazim tasks cannot move back to Pending.', true);
  setStatus(t, targetStatus);
});
function bindChange(el) {
  const kind = el.dataset.bind, i = Number(el.dataset.i), k = el.dataset.k;
  if (kind === 'roles') {
    const r = S.admin.roles[i];
    r[k] = el.type === 'checkbox' ? el.checked : (k === 'Level' ? Number(el.value) : el.value);
    if (k === 'ParentRole' || el.type === 'checkbox') paintRoles();
  }
  else if (kind === 'sched') {
    const s = S.admin.sched[i];
    if (k === 'Active') s.Active = el.checked ? 'Y' : 'N';
    else if (k === 'repeat') { if (el.value === 'week') { s.DayOfWeek = 1; s.DayOfMonth = ''; } else { s.DayOfMonth = 1; s.DayOfWeek = ''; } paintSched(); }
    else if (k === 'DayOfWeek' || k === 'DayOfMonth') s[k] = Number(el.value);
    else s[k] = el.value;
  }
}

/* ================= start ================= */
async function start() {
  applyPrefs();
  const needsConfig = !window.FIREBASE_CONFIG || window.FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY';
  if (needsConfig) return showLogin();
  const tok = store.get('tm.token');
  if (!tok) return showLogin();
  S.token = tok;
  mount($('#root'), h`<aside class="rail"><header class="top"><div class="brand">Task Management</div></header></aside><main class="page"><div class="chips"><div class="sk" style="height:36px;width:90px;border-radius:999px"></div><div class="sk" style="height:36px;width:110px;border-radius:999px"></div><div class="sk" style="height:36px;width:100px;border-radius:999px"></div></div>${skeletonRows(5)}</main>`);
  try { const r = await api('apiBootstrap', tok); if (r.newToken) { S.token = r.newToken; store.set('tm.token', r.newToken); } enter(r); }
  catch (e) { if (!e.auth) mount($('#root'), h`<main class="login"><div class="login-card"><h1>Could not connect</h1><p class="muted">${e.message}</p><div class="actions"><button class="btn primary" data-act="restart">Try again</button><button class="btn" data-act="signout">Sign in again</button></div></div></main>`); }
}
start();
})();
</script>
